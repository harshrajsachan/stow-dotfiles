# =========================================
# MPV Optimized Config
# Lightweight + Transparent Background
# =========================================

# ---------- Hardware Decoding ----------
hwdec=auto-safe

# ---------- Video Output ----------
vo=gpu
gpu-context=x11egl

# ---------- Transparent Background ----------
background-color=0/0/0/0
force-window=yes

# ---------- Scaling ----------
scale=bilinear
cscale=bilinear
dscale=bilinear

# ---------- Performance ----------
deband=no
sigmoid-upscaling=no
interpolation=no
framedrop=vo
vd-lavc-threads=2

# ---------- Cache ----------
cache=yes
cache-secs=5

# ---------- Sync ----------
video-sync=display-resample

# ---------- Audio ----------
audio-channels=stereo

# ---------- YouTube / yt-dlp ----------
ytdl-format=bestvideo[height<=720][vcodec^=avc1]+bestaudio/best[height<=720][vcodec^=avc1]/bestvideo[height<=720]+bestaudio/best[height<=720]

# ---------- Optional ----------
save-position-on-quit=yes
keep-open=no
osc=yes
