# ============================================================================
# Backend
# ============================================================================

backend = "glx";
vsync = true;


# ============================================================================
# Shadows
# ============================================================================

shadow = false;


# ============================================================================
# Fading / Animations
# ============================================================================

fading = false;


# ============================================================================
# Blur
# ============================================================================

blur-method = "dual_kawase";
blur-strength = 3;

blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;

corner-radius = 10;


# ============================================================================
# Global Opacity
# ============================================================================

active-opacity = 0.90;
inactive-opacity = 0.88;
frame-opacity = 1.0;


# ============================================================================
# Window Opacity
# ============================================================================

opacity-rule = [

  # --------------------------------------------------------------------------
  # Terminals
  # --------------------------------------------------------------------------

  "88:class_g = 'Alacritty'",
  "88:class_g = 'kitty'",

  # --------------------------------------------------------------------------
  # Documents
  # --------------------------------------------------------------------------

  "100:class_g = 'Zathura'",

  # --------------------------------------------------------------------------
  # Bars / Launcher
  # --------------------------------------------------------------------------

  "100:class_g = 'Polybar'",
  "80:class_g = 'Dunst'",
  "80:class_g = 'Rofi'",

  # --------------------------------------------------------------------------
  # Media
  # --------------------------------------------------------------------------

  "100:class_g = 'mpv'",
  "100:class_g = 'tekken3'",
  "100:class_g = 'duckstation-qt'",
  "90:class_g = 'code'",
  "100:class_g = 'vlc'",
  "100:class_g = 'btop'",
  "88:class_g = 'obsidian'",
  "88:name *= 'Monkeytype'",

];


# ============================================================================
# Focus Handling
# ============================================================================

mark-wmwin-focused = true;
mark-ovredir-focused = true;

detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;


# ============================================================================
# Performance Optimizations
# ============================================================================

use-damage = true;
detect-rounded-corners = false;
unredir-if-possible = true;
xrender-sync-fence = true;


# ============================================================================
# Window Types
# ============================================================================

wintypes:
{
  tooltip = {
    fade = false;
    shadow = false;
    opacity = 1.0;
  };

  dock = {
    shadow = false;
    clip-shadow-above = true;
  };

  dnd = {
    shadow = false;
  };

  popup_menu = {
    opacity = 1.0;
  };

  dropdown_menu = {
    opacity = 1.0;
  };
};
