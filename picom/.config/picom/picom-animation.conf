# ============================================================================
# Backend
# ============================================================================

backend = "glx";
vsync = true;


# ============================================================================
# Shadows
# ============================================================================

shadow = false;


# ============================================================================
# Fading
# ============================================================================

fading = true;

fade-in-step = 0.035;
fade-out-step = 0.045;
fade-delta = 8;


# ============================================================================
# ANIMATIONS
# ============================================================================

animations = true;


# ============================================================================
# Animation Physics
# ============================================================================

animation-stiffness-in-tag = 250;
animation-stiffness-tag-change = 50.0;

animation-window-mass = 0.4;
animation-dampening = 15;
animation-clamping = true;


# ============================================================================
# WINDOW OPEN
# ============================================================================

# Stronger than a simple fade
animation-for-open-window = "zoom";


# ============================================================================
# WINDOW CLOSE / MINIMIZE
# ============================================================================

animation-for-unmap-window = "squeeze";


# ============================================================================
# FLOATING / TRANSIENT WINDOWS
# ============================================================================

animation-for-transient-window = "slide-down";


# ============================================================================
# WORKSPACE TRANSITIONS
# ============================================================================

# Previous workspace
animation-for-prev-tag = "slide-left";
enable-fading-prev-tag = true;

# Next workspace
animation-for-next-tag = "slide-right";
enable-fading-next-tag = true;


# ============================================================================
# BLUR
# ============================================================================

blur-method = "dual_kawase";
blur-strength = 3;

blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;


# ============================================================================
# ROUNDED CORNERS
# ============================================================================

corner-radius = 10;


# ============================================================================
# GLOBAL OPACITY
# ============================================================================

active-opacity = 0.90;
inactive-opacity = 0.88;
frame-opacity = 1.0;


# ============================================================================
# WINDOW OPACITY
# ============================================================================

opacity-rule = [

  # --------------------------------------------------------------------------
  # Terminals
  # --------------------------------------------------------------------------

  "88:class_g = 'Alacritty'",
  "88:class_g = 'kitty'",
  "88:class_g = 'Spotify'",

  # --------------------------------------------------------------------------
  # Documents
  # --------------------------------------------------------------------------

  "100:class_g = 'Zathura'",

  # --------------------------------------------------------------------------
  # Bars / Launcher
  # --------------------------------------------------------------------------

  "100:class_g = 'Polybar'",
  "80:class_g = 'Dunst'",
  "80:class_g = 'Rofi'",

  # --------------------------------------------------------------------------
  # Media
  # --------------------------------------------------------------------------

  "100:class_g = 'mpv'",
  "100:class_g = 'tekken3'",
  "100:class_g = 'duckstation-qt'",
  "90:class_g = 'code'",
  "100:class_g = 'vlc'",
  "100:class_g = 'btop'",
  "88:class_g = 'obsidian'",
  "88:name *= 'Monkeytype'",

];


# ============================================================================
# FOCUS HANDLING
# ============================================================================

mark-wmwin-focused = true;
mark-ovredir-focused = true;

detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;


# ============================================================================
# PERFORMANCE
# ============================================================================

use-damage = true;
detect-rounded-corners = false;

unredir-if-possible = true;
xrender-sync-fence = true;


# ============================================================================
# WINDOW TYPES
# ============================================================================

wintypes:
{
  tooltip = {
    fade = true;
    shadow = false;
    opacity = 1.0;
  };

  dock = {
    fade = true;
    shadow = false;
    clip-shadow-above = true;
  };

  dnd = {
    fade = true;
    shadow = false;
  };

  popup_menu = {
    fade = true;
    opacity = 1.0;
  };

  dropdown_menu = {
    fade = true;
    opacity = 1.0;
  };
};
