# Backend
backend = "glx";
vsync = true;

# Shadows
shadow = false;

# Fading / Animations
fading = false;

# Blur
blur-method = "none";
blur-background = false;
blur-background-frame = false;
blur-background-fixed = false;

# Global Opacity
active-opacity = 0.95;
inactive-opacity = 0.88;
frame-opacity = 1.0;

opacity-rule = [

  # Terminals
  "90:class_g = 'Alacritty'",
  "88:class_g = 'kitty'",
  "100:class_g = 'Zathura'",

  # Bars / launcher
  "100:class_g = 'Polybar'",
  "90:class_g = 'Dunst'",
  "90:class_g = 'Rofi'",

  # Media
  "100:class_g = 'mpv'",
  "100:class_g = 'tekken3'",
  "100:class_g = 'duckstation-qt'",
  "90:class_g = 'code'",
  "100:class_g = 'vlc'",
  "88:class_g = 'obsidian'",
  "88:name *= 'Monkeytype'",

];

# Rounded Corners

#corner-radius = 8;

rounded-corners-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'dmenu'",
  "window_type = 'desktop'"
];

# Focus Handling
mark-wmwin-focused = true;
mark-ovredir-focused = true;

detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Performance Optimizations

use-damage = true;
detect-rounded-corners = false;
unredir-if-possible = true;
xrender-sync-fence = true;

# Window Types
wintypes:
{
  tooltip = {
    fade = false;
    shadow = false;
    opacity = 1.0;
  };

  dock = {
    shadow = false;
    clip-shadow-above = true;
  };

  dnd = {
    shadow = false;
  };

  popup_menu = {
    opacity = 1.0;
  };

  dropdown_menu = {
    opacity = 1.0;
  };
};
