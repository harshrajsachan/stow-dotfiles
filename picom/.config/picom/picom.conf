#################################
# Picom — Minimal Glass + Rounded
#################################

#################################
# Backend
#################################

backend = "glx";
vsync = true;

#################################
# Shadows
#################################

shadow = false;

#################################
# Fading / Animations
#################################

fading = false;

#################################
# Blur
#################################

blur-method = "none";
blur-background = false;
blur-background-frame = false;
blur-background-fixed = false;

#################################
# Global Opacity
#################################

active-opacity = 0.95;
inactive-opacity = 0.88;
frame-opacity = 1.0;

#################################
# Per-Window Opacity Rules
#################################

opacity-rule = [
  # Fullscreen
  "100:fullscreen",

  # Terminals
  "88:class_g = 'Alacritty'",
  "88:class_g = 'kitty'",
  "100:class_g = 'Zathura'",

  # Bars / launcher
  "85:class_g = 'Polybar'",
  "92:class_g = 'Dunst'",
  "95:class_g = 'Rofi'",

  # Media
  "100:class_g = 'mpv'",
  "100:class_g = 'vlc'",
  "100:name *= 'YouTube'",

  # 9anime PWA
  "100:class_i = '9anime.org.lv__bookmark'",

  # Netmirror / net20
  "100:class_i = 'net20.cc'",

  # Fallback title matching
  "100:name *= '9anime'",
  "100:name *= 'net20'",
];
blur-background-exclude = [
  "class_g = 'Zathura'"
];

#################################
# Rounded Corners
#################################

corner-radius = 8;

rounded-corners-exclude = [
  "class_g = 'Rofi'",
  "class_g = 'dmenu'",
  "window_type = 'desktop'"
];

#################################
# Focus Handling
#################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;

detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

#################################
# Performance Optimizations
#################################

use-damage = true;

detect-rounded-corners = false;

unredir-if-possible = true;

xrender-sync-fence = true;

#################################
# Window Types
#################################

wintypes:
{
  tooltip = {
    fade = false;
    shadow = false;
    opacity = 1.0;
  };

  dock = {
    shadow = false;
    clip-shadow-above = true;
  };

  dnd = {
    shadow = false;
  };

  popup_menu = {
    opacity = 1.0;
  };

  dropdown_menu = {
    opacity = 1.0;
  };
};
