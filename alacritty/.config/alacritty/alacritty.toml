# ============================================================
# THEME
# ============================================================

[general]
import = [
    "~/.config/themes/current/alacritty.toml"
]

live_config_reload = true


# ============================================================
# FONT
# ============================================================

[font]
size = 10.75

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "SemiBold Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"


# ============================================================
# WINDOW
# ============================================================

[window]
padding = { x = 0, y = 0 }
dynamic_padding = false


# ============================================================
# CURSOR
# ============================================================

[cursor]
style = { shape = "Underline", blinking = "Always" }
blink_interval = 500
blink_timeout = 0
unfocused_hollow = true


# ============================================================
# BELL
# ============================================================

[bell]
duration = 0


# ============================================================
# SELECTION
# ============================================================

[selection]
save_to_clipboard = true


# ============================================================
# SCROLLBACK
# ============================================================

[scrolling]
history = 1000
multiplier = 3


# ============================================================
# KEYBINDINGS
# ============================================================

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "0"
mods = "Control"
action = "ResetFontSize"
