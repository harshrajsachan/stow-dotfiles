; ============================================================
;                 POLYBAR VERTICAL TEST
; ============================================================

[colors]
background = #55000000
foreground = #FFFFFF
accent = #FFFFFF
red = #FF5555


; ============================================================
;                     VERTICAL BAR
; ============================================================

[bar/vertical]
width = 32px
height = 100%

bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 0
padding-left = 0
padding-right = 0

module-margin = 0
separator = ""

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;2"

orientation = vertical

modules-left =
modules-center = test-rofi test-i3 test-date test-volume test-brightness test-cpu test-memory test-temperature test-battery test-network
modules-right =


; ============================================================
;                         ROFI
; ============================================================

[module/test-rofi]
type = custom/text

format = <label>

label = 
label-foreground = ${colors.accent}

click-left = rofi -show drun
click-right = rofi -show run


; ============================================================
;                          I3
; ============================================================

[module/test-i3]
type = internal/i3

pin-workspaces = true
index-sort = true

format = <label-state>

label-focused = %index%
label-focused-foreground = ${colors.accent}
label-focused-padding = 0

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 0

label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 0

label-urgent = %index%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 0


; ============================================================
;                          DATE
; ============================================================

[module/test-date]
type = internal/date

interval = 1

date = %H:%M

format = <label>

label = 󰥔
label-foreground = ${colors.accent}


; ============================================================
;                         VOLUME
; ============================================================

[module/test-volume]
type = internal/pulseaudio

use-ui-max = false
enable-scroll = true

format-volume = <ramp-volume>

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

ramp-volume-foreground = ${colors.accent}

format-muted = <label-muted>

label-muted = 󰝟
label-muted-foreground = ${colors.accent}

click-right = pavucontrol

scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%


; ============================================================
;                       BRIGHTNESS
; ============================================================

[module/test-brightness]
type = custom/script

exec = echo "󰃠"

interval = 1

format = <label>
label = %output%
label-foreground = ${colors.accent}

scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-


; ============================================================
;                           CPU
; ============================================================

[module/test-cpu]
type = internal/cpu

interval = 3

format = <label>

label = 󰍛
label-foreground = ${colors.accent}


; ============================================================
;                         MEMORY
; ============================================================

[module/test-memory]
type = internal/memory

interval = 3

format = <label>

label = 󰘚
label-foreground = ${colors.accent}


; ============================================================
;                       TEMPERATURE
; ============================================================

[module/test-temperature]
type = internal/temperature

interval = 2

thermal-zone = 0

warn-temperature = 80

format = <ramp>

format-warn = <ramp>

ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-3 = 
ramp-4 = 

ramp-0-foreground = ${colors.accent}
ramp-1-foreground = ${colors.accent}
ramp-2-foreground = ${colors.accent}
ramp-3-foreground = ${colors.foreground}
ramp-4-foreground = ${colors.red}


; ============================================================
;                         BATTERY
; ============================================================

[module/test-battery]
type = internal/battery

battery = BAT0
adapter = AC

poll-interval = 5

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>

label-charging = 󰂄
label-charging-foreground = ${colors.accent}

label-discharging = 󰁹
label-discharging-foreground = ${colors.accent}

label-full = 󰁹
label-full-foreground = ${colors.accent}


; ============================================================
;                         NETWORK
; ============================================================

[module/test-network]
type = internal/network

interface-type = wireless

interval = 5

format-connected = <label-connected>
format-connected-prefix = 󰖩
format-connected-prefix-foreground = ${colors.accent}

label-connected =
label-connected-foreground = ${colors.foreground}

format-disconnected = <label-disconnected>
format-disconnected-prefix = 󰖪
format-disconnected-prefix-foreground = ${colors.accent}

label-disconnected =
