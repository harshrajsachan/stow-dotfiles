; ==================================================
;                       i3
; ==================================================

[module/i3]
type = internal/i3

pin-workspaces = true
index-sort = true

format = <label-state>

label-focused = %name%
label-focused-background = ${colors.surface0}
label-focused-foreground = ${colors.text}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.text}
label-unfocused-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.subtext1}
label-visible-padding = 0

label-urgent = %name%
label-urgent-background = ${colors.blood}
label-urgent-foreground = ${colors.text}
label-urgent-padding = 2


; ==================================================
;                       DATE
; ==================================================

[module/date]
type = internal/date

interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

format = <label>
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.accent}

label = %date%
label-foreground = ${colors.text}


; ==================================================
;                 SCREEN RECORDING
; ==================================================

[module/recording]
type = custom/script

exec = if [ -f /tmp/gpu-screen-recorder.pid ]; then echo "󰄀"; else echo "󰄄"; fi

interval = 1
tail = true

format = <label>
format-foreground = ${colors.accent}

label = %output%
label-padding = 1

click-right = ~/.config/i3/scripts/record_toggle.sh
click-left = flameshot full -p ~/Screenshots -c


; ==================================================
;                        MPD
; ==================================================

[module/mpd]
type = internal/mpd

host = 127.0.0.1
port = 6600

format-online = <toggle> <label-song>
format-online-foreground = ${colors.accent}

label-song = %title%
label-song-maxlen = 25
label-song-ellipsis = true
label-song-foreground = ${colors.text}

label-offline = Offline
label-offline-foreground = ${colors.overlay0}

icon-play = 󰐊
icon-pause = 󰏤
icon-stop = 󰓛

toggle-on-foreground = ${colors.accent}
toggle-off-foreground = ${colors.overlay0}

click-left = kitty -e ncmpcpp

scroll-up = mpc volume +5
scroll-down = mpc volume -5


; ==================================================
;                      AUDIO
; ==================================================

[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = false
enable-scroll = true

format-volume = <ramp-volume> <label-volume>

label-volume = %percentage:2%%
label-volume-foreground = ${colors.text}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

ramp-volume-foreground = ${colors.accent}

format-muted = <label-muted>
label-muted = 󰝟
label-muted-foreground = ${colors.text}

mutedclick-right = pavucontrol

scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%


; ==================================================
;                   BRIGHTNESS
; ==================================================

[module/brightness]
type = custom/script

exec = brightnessctl -m | awk -F, '{printf "%2s", $4}'
interval = 1

format-prefix = "󰃠 "
format-prefix-foreground = ${colors.accent}

label = %output%


; ==================================================
;                      MEMORY
; ==================================================

[module/memory]
type = internal/memory

interval = 3

format-prefix = "󰘚 "
format-prefix-foreground = ${colors.accent}

label = %percentage_used:2%%
label-foreground = ${colors.text}


; ==================================================
;                        CPU
; ==================================================

[module/cpu]
type = internal/cpu

interval = 3

format-prefix = "󰍛 "
format-prefix-foreground = ${colors.accent}

label = %percentage:2%%
label-foreground = ${colors.text}


; ==================================================
;                   TEMPERATURE
; ==================================================

[module/temperature]
type = internal/temperature

interval = 2
thermal-zone = 0

warn-temperature = 80

format = <ramp> <label>
format-foreground = ${colors.text}

format-warn = <ramp> <label-warn>
format-warn-foreground = ${colors.blood}

label = %temperature-c%
label-warn = %temperature-c%

ramp-0 = 
ramp-0-foreground = ${colors.accent-soft}

ramp-1 = 
ramp-1-foreground = ${colors.accent-soft}

ramp-2 = 
ramp-2-foreground = ${colors.accent}

ramp-3 = 
ramp-3-foreground = ${colors.white}

ramp-4 = 
ramp-4-foreground = ${colors.blood}


; ==================================================
;                     BATTERY
; ==================================================

[module/battery]
type = internal/battery

battery = BAT0
adapter = AC

poll-interval = 5
full-at = 98
low-at = 15

format-charging = <label-charging>
format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = ${colors.accent}

label-charging = %percentage:2%%
label-charging-foreground = ${colors.text}

format-discharging = <label-discharging>
format-discharging-prefix = "󰁹 "
format-discharging-prefix-foreground = ${colors.accent}

label-discharging = %percentage:2%%
label-discharging-foreground = ${colors.text}

format-full = <label-full>
format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.accent}

label-full = 100%
label-full-foreground = ${colors.text}


; ==================================================
;                      NETWORK
; ==================================================

[module/wlan]
type = internal/network

interface-type = wireless
interval = 5

format-connected = <label-connected>
format-connected-prefix = "󰖩 "
format-connected-prefix-foreground = ${colors.accent}

label-connected = %essid%
label-connected-foreground = ${colors.text}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰖪 "
format-disconnected-prefix-foreground = ${colors.accent}

label-disconnected = offline
label-disconnected-foreground = ${colors.accent}


; ==================================================
;                       ROFI
; ==================================================

[module/rofi]
type = custom/text

format = <label>
format-foreground = ${colors.accent}

label = %{T2}%{T-}
label-padding = 1

click-left = rofi -show drun
click-right = rofi -show run


; ==================================================
;                     POLYCAT
; ==================================================

[module/polycat]
type = custom/script

exec = polycat
tail = true

format-padding = 0
