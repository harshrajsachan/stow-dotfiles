; ==================================================
;                     COLORS
; ==================================================

[colors]
base = #00000000
mantle = #00000000
crust = #00000000

text = #f0f0f0
subtext1 = #d4c8c8
overlay0 = #b0a0a0

surface0 = #1a1a1a
surface1 = #252525
surface2 = #303030

red = #c24c5a
red-alt = #d35d6e
red-soft = #e07a86

white = #ffffff
gray = #d6d6d6

transparent = #00000000


; ==================================================
;                  BASE BAR
; ==================================================

[bar/main]
width = 100%

background = #00000000
foreground = ${colors.text}

line-size = 0
border-size = 0
border-color = ${colors.transparent}

padding-left = 0
padding-right = 1

module-margin = 0

separator = " "
separator-foreground = ${colors.transparent}

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;2"

modules-left = rofi i3
modules-center = date
modules-right = recording mpd pulseaudio brightness memory cpu temperature battery wlan

cursor-click = pointer
enable-ipc = true
wm-restack = i3
override-redirect = false


; ==================================================
;                 TOP BAR
; ==================================================

[bar/top]
inherit = bar/main
bottom = false
height = 12pt


; ==================================================
;                BOTTOM BAR
; ==================================================

[bar/bottom]
inherit = bar/main
bottom = true
height = 14pt

padding-left = 0
padding-right = 1


; ==================================================
;                      i3
; ==================================================

[module/i3]
type = internal/i3

pin-workspaces = true
index-sort = true

format = <label-state>

label-focused = %name%
label-focused-background = ${colors.red}
label-focused-foreground = ${colors.white}
label-focused-underline = ${colors.red}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.gray}

label-visible = %name%
label-visible-padding = 1
label-visible-foreground = ${colors.red}

label-urgent = %name%
label-urgent-background = ${colors.red-alt}
label-urgent-foreground = ${colors.white}
label-urgent-padding = 1


; ==================================================
;                     DATE
; ==================================================

[module/date]
type = internal/date

interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

format = <label>
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.red}

label = %date%
label-foreground = ${colors.text}


; ==================================================
;                SCREEN RECORD
; ==================================================

[module/recording]
type = custom/script

exec = if [ -f /tmp/gpu-screen-recorder.pid ]; then echo "%{F#c24c5a}󰄀%{F-}"; else echo "󰄄"; fi

interval = 1
tail = true

click-left = ~/.config/i3/scripts/record_toggle.sh
click-right = flameshot full -p ~/Screenshots -c

format-padding = 1


; ==================================================
;                      MPD
; ==================================================

[module/mpd]
type = internal/mpd

host = 127.0.0.1
port = 6600

format-online = <toggle> <label-song>
format-online-foreground = ${colors.red}

label-song = %title%
label-song-maxlen = 25
label-song-ellipsis = true
label-song-foreground = ${colors.text}

label-offline = Offline
label-offline-foreground = ${colors.gray}

icon-play = 󰐊
icon-pause = 󰏤
icon-stop = 󰓛

toggle-on-foreground = ${colors.red}
toggle-off-foreground = ${colors.gray}

click-left = kitty -e ncmpcpp

scroll-up = mpc volume +5
scroll-down = mpc volume -5


; ==================================================
;                    AUDIO
; ==================================================

[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = false
enable-scroll = true

format-volume = <ramp-volume> <label-volume>

label-volume = %percentage:2%%
label-volume-foreground = ${colors.text}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

ramp-volume-foreground = ${colors.red}

format-muted = <label-muted>

label-muted = %{F#c24c5a}󰝟%{F-} %{F#f0f0f0}muted%{F-}

click-right = pavucontrol

scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%


; ==================================================
;                  BRIGHTNESS
; ==================================================

[module/brightness]
type = custom/script

exec = brightnessctl -m | awk -F, '{printf "%2s", $4}'
interval = 1

format-prefix = "󰃠 "
format-prefix-foreground = ${colors.red}

label = %output%

scroll-up = brightnessctl set +5%
scroll-down = brightnessctl set 5%-


; ==================================================
;                    MEMORY
; ==================================================

[module/memory]
type = internal/memory

interval = 3

format-prefix = "󰘚 "
format-prefix-foreground = ${colors.red}

label = %percentage_used:2%%
label-foreground = ${colors.text}


; ==================================================
;                     CPU
; ==================================================

[module/cpu]
type = internal/cpu

interval = 3

format-prefix = "󰍛 "
format-prefix-foreground = ${colors.red}

label = %percentage:2%%
label-foreground = ${colors.text}


; ==================================================
;                 TEMPERATURE
; ==================================================

[module/temperature]
type = internal/temperature

interval = 2
thermal-zone = 0

warn-temperature = 80

format = <ramp> <label>
format-foreground = ${colors.text}

format-warn = <ramp> <label-warn>
format-warn-foreground = ${colors.red}

label = %temperature-c%
label-warn = %temperature-c%

ramp-0 = 
ramp-0-foreground = ${colors.red}

ramp-1 = 
ramp-1-foreground = ${colors.red}

ramp-2 = 
ramp-2-foreground = ${colors.red-alt}

ramp-3 = 
ramp-3-foreground = ${colors.red}

ramp-4 = 
ramp-4-foreground = ${colors.white}


; ==================================================
;                   BATTERY
; ==================================================

[module/battery]
type = internal/battery

battery = BAT0
adapter = AC

poll-interval = 5
full-at = 98
low-at = 15

format-charging = <label-charging>
format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = ${colors.red}

label-charging = %percentage:2%%
label-charging-foreground = ${colors.text}

format-discharging = <label-discharging>
format-discharging-prefix = "󰁹 "
format-discharging-prefix-foreground = ${colors.red}

label-discharging = %percentage:2%%
label-discharging-foreground = ${colors.text}

format-full = <label-full>
format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.red}

label-full = 100%
label-full-foreground = ${colors.text}


; ==================================================
;                    NETWORK
; ==================================================

[module/wlan]
type = internal/network

interface-type = wireless
interval = 5

format-connected = <label-connected>
format-connected-prefix = "󰖩 "
format-connected-prefix-foreground = ${colors.red}

label-connected = %essid%
label-connected-foreground = ${colors.text}

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰖪 "
format-disconnected-prefix-foreground = ${colors.white}

label-disconnected = offline
label-disconnected-foreground = ${colors.white}


; ==================================================
;                    ROFI
; ==================================================

[module/rofi]
type = custom/text

format = <label>
format-foreground = ${colors.red}

label = %{T2}%{T-}
label-padding = 1

click-left = rofi -show drun
click-right = rofi -show run


; ==================================================
;                   SETTINGS
; ==================================================

[settings]
screenchange-reload = true
pseudo-transparency = true
