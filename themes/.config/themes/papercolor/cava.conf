## Configuration file for CAVA.
##
## PaperColor Theme

[general]

live-config = 0
framerate = 60
autosens = 1
sensitivity = 100
scaling = linear
bars = 0
bar_width = 2
bar_spacing = 1
center_align = 1
max_height = 100
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
sleep_timer = 0


[input]

method = pipewire
source = auto

sample_rate = 48000
sample_bits = 16

active = 1
remix = 1
virtual = 1


[output]

method = noncurses

orientation = bottom

channels = stereo
mono_option = average
reverse = 0

split_stereo = 0
left_bottom = 1

xaxis = none

synchronized_sync = 0

disable_blanking = 0

show_idle_bar_heads = 1

waveform = 0


[color]

# --------------------------------------------------
# PAPER COLOR
# --------------------------------------------------

background = '#F2EDE3'
foreground = '#292724'

gradient = 1
gradient_count = 6

# Bottom -> top
# Dark Ink → Teal → Blue → Green → Gold → Red

gradient_color_1 = '#292724'
gradient_color_2 = '#4F7470'
gradient_color_3 = '#4A6280'
gradient_color_4 = '#4F6B4A'
gradient_color_5 = '#9A761F'
gradient_color_6 = '#A33A3A'


[smoothing]

monstercat = 0
waves = 0

noise_reduction = 77


[eq]

# Equalizer disabled by default.
