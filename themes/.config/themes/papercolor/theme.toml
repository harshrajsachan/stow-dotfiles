    fg = "#5C5954",
}

list = {
    fg = "#5C5954",
}

btn_yes = {
    fg = "#F2EDE3",
    bg = "#4A6280",
    bold = true,
}

btn_no = {
    fg = "#F2EDE3",
    bg = "#A33A3A",
    bold = true,
