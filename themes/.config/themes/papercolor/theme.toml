# ============================================================
# PAPERCOLOR — YAZI
# Warm Paper / Ink / Blue / Gold / Red
# ============================================================

#
# PALETTE
#

# PAPER       #F2EDE3  background
# PAPER_0     #ECE6DB  darkest surface
# PAPER_1     #E5DED3  surface
# PAPER_2     #DCD4C8  raised surface

# INK         #292724  primary text
# INK_DIM     #5C5954  secondary text
# GRAY        #6F6A62  muted text
# GRAY_DIM    #8A847B  hidden / very muted
# BORDER      #B8B1A6  borders

# SELECT      #4A6280  current item highlight
# SELECT_DIM  #617D9F  preview highlight

# ============================================================


# ============================================================
# APPLICATION
# ============================================================

[app]

overall = {
    fg = "#292724",
}


# ============================================================
# MANAGER
# ============================================================

[mgr]

cwd = {
    fg = "#292724",
    bold = true,
}

find_keyword = {
    fg = "#F2EDE3",
    bg = "#B8B1A6",
    bold = true,
}

find_position = {
    fg = "#6F6A62",
    italic = true,
}

symlink_target = {
    fg = "#6F6A62",
}

marker_copied = {
    fg = "#F2EDE3",
    bg = "#617D9F",
}

marker_cut = {
    fg = "#F2EDE3",
    bg = "#6F6A62",
}

marker_marked = {
    fg = "#F2EDE3",
    bg = "#5C5954",
}

marker_selected = {
    fg = "#F2EDE3",
    bg = "#4A6280",
}

count_copied = {
    fg = "#F2EDE3",
    bg = "#617D9F",
}

count_cut = {
    fg = "#F2EDE3",
    bg = "#6F6A62",
}

count_selected = {
    fg = "#F2EDE3",
    bg = "#4A6280",
}

border_symbol = "│"

border_style = {
    fg = "#B8B1A6",
}


# ============================================================
# INDICATOR
#
# current = active row
# parent  = active row in parent pane
# preview = active row in preview pane
#
# Padding creates the visible highlighted indicator block.
# ============================================================

[indicator]

parent = {
    fg = "#F2EDE3",
    bg = "#617D9F",
    bold = true,
}

current = {
    fg = "#F2EDE3",
    bg = "#4A6280",
    bold = true,
}

preview = {
    fg = "#F2EDE3",
    bg = "#617D9F",
    bold = true,
}

padding = {
    open = "▐",
    close = "▌",
}


# ============================================================
# TABS
# ============================================================

[tabs]

active = {
    fg = "#F2EDE3",
    bg = "#4A6280",
    bold = true,
}

inactive = {
    fg = "#8A847B",
}

sep_inner = {
    open = "",
    close = "",
}

sep_outer = {
    open = "",
    close = "",
}


# ============================================================
# MODE
# ============================================================

[mode]

normal_main = {
    fg = "#F2EDE3",
    bg = "#4A6280",
    bold = true,
}

normal_alt = {
    fg = "#292724",
    bold = true,
}

select_main = {
    fg = "#F2EDE3",
    bg = "#617D9F",
    bold = true,
}

select_alt = {
    fg = "#5C5954",
    bold = true,
}

unset_main = {
    fg = "#F2EDE3",
    bg = "#6F6A62",
    bold = true,
}

unset_alt = {
    fg = "#6F6A62",
    bold = true,
}


# ============================================================
# STATUS
# ============================================================

[status]

overall = {
    fg = "#5C5954",
}

sep_left = {
    open = "",
    close = "",
}

sep_right = {
    open = "",
    close = "",
}

perm_type = {
    fg = "#292724",
}

perm_read = {
    fg = "#5C5954",
}

perm_write = {
    fg = "#6F6A62",
}

perm_exec = {
    fg = "#A33A3A",
}

perm_sep = {
    fg = "#B8B1A6",
}

progress_label = {
    fg = "#5C5954",
}

progress_normal = {
    fg = "#5C5954",
}

progress_error = {
    fg = "#A33A3A",
}


# ============================================================
# FILE TYPES
# ============================================================

[filetype]

rules = [

    # --------------------------------------------------------
    # DIRECTORIES
    # --------------------------------------------------------

    {
        url = "*/",
        fg = "#4A6280",
        bold = true,
    },

    # --------------------------------------------------------
    # IMAGES
    # --------------------------------------------------------

    {
        mime = "image/*",
        fg = "#4F7470",
    },

    # --------------------------------------------------------
    # VIDEO
    # --------------------------------------------------------

    {
        mime = "video/*",
        fg = "#7A596F",
    },

    # --------------------------------------------------------
    # AUDIO
    # --------------------------------------------------------

    {
        mime = "audio/*",
        fg = "#4F6B4A",
    },

    # --------------------------------------------------------
    # ARCHIVES
    # --------------------------------------------------------

    {
        mime = "application/zip",
        fg = "#9A761F",
    },

    {
        mime = "application/x-tar",
        fg = "#9A761F",
    },

    {
        mime = "application/x-7z-compressed",
        fg = "#9A761F",
    },

    {
        mime = "application/x-rar",
        fg = "#9A761F",
    },

    # --------------------------------------------------------
    # EXECUTABLES
    # --------------------------------------------------------

    {
        url = "*",
        is = "exec",
        fg = "#A33A3A",
        bold = true,
    },

    # --------------------------------------------------------
    # SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "link",
        fg = "#4F7470",
    },

    # --------------------------------------------------------
    # BROKEN SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "orphan",
        fg = "#A33A3A",
        crossed = true,
    },

    # --------------------------------------------------------
    # EMPTY FILES
    # --------------------------------------------------------

    {
        mime = "inode/empty",
        fg = "#8A847B",
    },

    # --------------------------------------------------------
    # NORMAL FILES
    # --------------------------------------------------------

    {
        url = "*",
        fg = "#5C5954",
    },
]


# ============================================================
# ICONS
#
# Icons use the PaperColor accent hierarchy.
#
# Blue       = important / directories
# Green      = normal programming files
# Gray       = documents / archives / hidden
# ============================================================

[icon]

# ------------------------------------------------------------
# DIRECTORIES
# ------------------------------------------------------------

prepend_dirs = [
    {
        name = "*",
        text = "",
        fg = "#4A6280",
    },
]


# ------------------------------------------------------------
# C / C++
# ------------------------------------------------------------

prepend_exts = [

    { name = "c",   text = "", fg = "#4F6B4A" },
    { name = "h",   text = "", fg = "#4F6B4A" },
    { name = "cpp", text = "", fg = "#4F6B4A" },
    { name = "cc",  text = "", fg = "#4F6B4A" },
    { name = "hpp", text = "", fg = "#4F6B4A" },

    # --------------------------------------------------------
    # Java
    # --------------------------------------------------------

    { name = "java", fg = "#4F6B4A", text = "" },

    # --------------------------------------------------------
    # Python
    # --------------------------------------------------------

    { name = "py", fg = "#4F6B4A", text = "" },

    # --------------------------------------------------------
    # JavaScript
    # --------------------------------------------------------

    { name = "js",  fg = "#9A761F", text = "" },
    { name = "mjs", fg = "#9A761F", text = "" },
    { name = "cjs", fg = "#9A761F", text = "" },

    # --------------------------------------------------------
    # TypeScript
    # --------------------------------------------------------

    { name = "ts",  fg = "#9A761F", text = "" },
    { name = "tsx", fg = "#9A761F", text = "" },

    # --------------------------------------------------------
    # Lua
    # --------------------------------------------------------

    { name = "lua", fg = "#4F7470", text = "" },

    # --------------------------------------------------------
    # Rust
    # --------------------------------------------------------

    { name = "rs", fg = "#A33A3A", text = "" },

    # --------------------------------------------------------
    # Go
    # --------------------------------------------------------

    { name = "go", fg = "#4A6280", text = "" },

    # --------------------------------------------------------
    # HTML
    # --------------------------------------------------------

    { name = "html", fg = "#A33A3A", text = "" },

    # --------------------------------------------------------
    # CSS
    # --------------------------------------------------------

    { name = "css", fg = "#617D9F", text = "" },

    # --------------------------------------------------------
    # JSON
    # --------------------------------------------------------

    { name = "json", fg = "#9A761F", text = "" },

    # --------------------------------------------------------
    # YAML
    # --------------------------------------------------------

    { name = "yaml", fg = "#9A761F", text = "" },
    { name = "yml",  fg = "#9A761F", text = "" },

    # --------------------------------------------------------
    # Markdown
    # --------------------------------------------------------

    { name = "md", fg = "#4F7470", text = "" },

    # --------------------------------------------------------
    # Shell
    # --------------------------------------------------------

    { name = "sh",   fg = "#A33A3A", text = "" },
    { name = "bash", fg = "#A33A3A", text = "" },
    { name = "zsh",  fg = "#A33A3A", text = "" },

    # --------------------------------------------------------
    # SQL
    # --------------------------------------------------------

    { name = "sql", fg = "#4A6280", text = "" },

    # --------------------------------------------------------
    # TOML
    # --------------------------------------------------------

    { name = "toml", fg = "#9A761F", text = "" },

    # --------------------------------------------------------
    # TXT
    # --------------------------------------------------------

    { name = "txt", fg = "#8A847B", text = "" },

    # --------------------------------------------------------
    # PDF
    # --------------------------------------------------------

    { name = "pdf", fg = "#A33A3A", text = "" },

    # --------------------------------------------------------
    # Archives
    # --------------------------------------------------------

    { name = "zip", fg = "#9A761F", text = "" },
    { name = "tar", fg = "#9A761F", text = "" },
    { name = "gz",  fg = "#9A761F", text = "" },
    { name = "7z",  fg = "#9A761F", text = "" },
    { name = "rar", fg = "#9A761F", text = "" },
]


# ============================================================
# SPECIAL FILES
# ============================================================

prepend_files = [

    {
        name = ".gitignore",
        text = "",
        fg = "#5C5954",
    },

    {
        name = ".gitmodules",
        text = "",
        fg = "#5C5954",
    },

    {
        name = "Dockerfile",
        text = "",
        fg = "#5C5954",
    },

    {
        name = "Makefile",
        text = "",
        fg = "#5C5954",
    },
]


# ============================================================
# CONDITIONAL ICONS
# ============================================================

prepend_conds = [

    # --------------------------------------------------------
    # BROKEN SYMLINKS
    # --------------------------------------------------------

    {
        if = "orphan",
        text = "",
        fg = "#A33A3A",
    },

    # --------------------------------------------------------
    # SYMLINKS
    # --------------------------------------------------------

    {
        if = "link",
        text = "",
        fg = "#4F7470",
    },

    # --------------------------------------------------------
    # HIDDEN DIRECTORIES
    # --------------------------------------------------------

    {
        if = "hidden & dir",
        text = "",
        fg = "#8A847B",
    },

    # --------------------------------------------------------
    # DIRECTORIES
    #
    # Explicitly handle directories BEFORE executable files.
    # --------------------------------------------------------

    {
        if = "dir",
        text = "",
        fg = "#4A6280",
    },

    # --------------------------------------------------------
    # HIDDEN FILES
    # --------------------------------------------------------

    {
        if = "hidden & !dir",
        text = "",
        fg = "#8A847B",
    },

    # --------------------------------------------------------
    # EXECUTABLE FILES
    #
    # IMPORTANT:
    # !dir prevents directories from receiving the terminal
    # icon merely because they have the executable permission.
    # --------------------------------------------------------

    {
        if = "exec & !dir",
        text = "",
        fg = "#A33A3A",
    },
]


# ============================================================
# WHICH
# ============================================================

[which]

