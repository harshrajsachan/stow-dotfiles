    fg = "#292724",
    bold = true,
}

rest = {
    fg = "#6F6A62",
}

desc = {
    fg = "#5C5954",
}

separator = " → "

separator_style = {
    fg = "#B8B1A6",
}


# ============================================================
# CONFIRM
# ============================================================

[confirm]

