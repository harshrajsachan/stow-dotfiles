# ============================================================
# NORD — YAZI
# ============================================================
#
# Polar Night
#
# nord0  #2E3440
# nord1  #3B4252
# nord2  #434C5E
# nord3  #4C566A
#
# Snow Storm
#
# nord4  #D8DEE9
# nord5  #E5E9F0
# nord6  #ECEFF4
#
# Frost
#
# nord7  #8FBCBB
# nord8  #88C0D0
# nord9  #81A1C1
# nord10 #5E81AC
#
# Aurora
#
# nord11 #BF616A
# nord12 #D08770
# nord13 #EBCB8B
# nord14 #A3BE8C
# nord15 #B48EAD
#
# ============================================================


# ============================================================
# APPLICATION
# ============================================================

[app]

overall = {
    fg = "#D8DEE9",
}


# ============================================================
# MANAGER
# ============================================================

[mgr]

cwd = {
    fg = "#88C0D0",
    bold = true,
}

find_keyword = {
    fg = "#EBCB8B",
    bold = true,
}

find_position = {
    fg = "#B48EAD",
    italic = true,
}

symlink_target = {
    fg = "#8FBCBB",
}

marker_copied = {
    fg = "#2E3440",
    bg = "#A3BE8C",
}

marker_cut = {
    fg = "#2E3440",
    bg = "#BF616A",
}

marker_marked = {
    fg = "#2E3440",
    bg = "#EBCB8B",
}

marker_selected = {
    fg = "#2E3440",
    bg = "#88C0D0",
}

count_copied = {
    fg = "#2E3440",
    bg = "#A3BE8C",
}

count_cut = {
    fg = "#2E3440",
    bg = "#BF616A",
}

count_selected = {
    fg = "#2E3440",
    bg = "#88C0D0",
}

border_symbol = "│"

border_style = {
    fg = "#4C566A",
}


# ============================================================
# INDICATOR
#
# Strong moving active-row highlight.
# ============================================================

[indicator]

# Parent pane
parent = {
    fg = "#2E3440",
    bg = "#81A1C1",
    bold = true,
}

# Main pane
current = {
    fg = "#2E3440",
    bg = "#88C0D0",
    bold = true,
}

# Preview pane
preview = {
    fg = "#2E3440",
    bg = "#8FBCBB",
    bold = true,
}

padding = {
    open = "▐",
    close = "▌",
}


# ============================================================
# TABS
# ============================================================

[tabs]

active = {
    fg = "#2E3440",
    bg = "#88C0D0",
    bold = true,
}

inactive = {
    fg = "#4C566A",
}

sep_inner = {
    open = "",
    close = "",
}

sep_outer = {
    open = "",
    close = "",
}


# ============================================================
# MODE
# ============================================================

[mode]

normal_main = {
    fg = "#2E3440",
    bg = "#88C0D0",
    bold = true,
}

normal_alt = {
    fg = "#88C0D0",
    bold = true,
}

select_main = {
    fg = "#2E3440",
    bg = "#A3BE8C",
    bold = true,
}

select_alt = {
    fg = "#A3BE8C",
    bold = true,
}

unset_main = {
    fg = "#2E3440",
    bg = "#BF616A",
    bold = true,
}

unset_alt = {
    fg = "#BF616A",
    bold = true,
}


# ============================================================
# STATUS
# ============================================================

[status]

overall = {
    fg = "#D8DEE9",
}

sep_left = {
    open = "",
    close = "",
}

sep_right = {
    open = "",
    close = "",
}

perm_type = {
    fg = "#81A1C1",
}

perm_read = {
    fg = "#A3BE8C",
}

perm_write = {
    fg = "#BF616A",
}

perm_exec = {
    fg = "#D08770",
}

perm_sep = {
    fg = "#4C566A",
}

progress_label = {
    fg = "#D8DEE9",
}

progress_normal = {
    fg = "#88C0D0",
}

progress_error = {
    fg = "#BF616A",
}


# ============================================================
# FILE TYPES
# ============================================================

[filetype]

rules = [

    # --------------------------------------------------------
    # DIRECTORIES
    # --------------------------------------------------------

    {
        url = "*/",
        fg = "#88C0D0",
        bold = true,
    },

    # --------------------------------------------------------
    # IMAGES
    # --------------------------------------------------------

    {
        mime = "image/*",
        fg = "#B48EAD",
    },

    # --------------------------------------------------------
    # VIDEO
    # --------------------------------------------------------

    {
        mime = "video/*",
        fg = "#BF616A",
    },

    # --------------------------------------------------------
    # AUDIO
    # --------------------------------------------------------

    {
        mime = "audio/*",
        fg = "#8FBCBB",
    },

    # --------------------------------------------------------
    # ARCHIVES
    # --------------------------------------------------------

    {
        mime = "application/zip",
        fg = "#D08770",
    },

    {
        mime = "application/x-tar",
        fg = "#D08770",
    },

    {
        mime = "application/x-7z-compressed",
        fg = "#D08770",
    },

    {
        mime = "application/x-rar",
        fg = "#D08770",
    },

    # --------------------------------------------------------
    # EXECUTABLES
    # --------------------------------------------------------

    {
        url = "*",
        is = "exec",
        fg = "#A3BE8C",
        bold = true,
    },

    # --------------------------------------------------------
    # SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "link",
        fg = "#8FBCBB",
    },

    # --------------------------------------------------------
    # BROKEN SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "orphan",
        fg = "#BF616A",
        crossed = true,
    },

    # --------------------------------------------------------
    # EMPTY
    # --------------------------------------------------------

    {
        mime = "inode/empty",
        fg = "#4C566A",
    },

    # --------------------------------------------------------
    # NORMAL FILES
    # --------------------------------------------------------

    {
        url = "*",
        fg = "#D8DEE9",
    },
]


# ============================================================
# ICONS
# ============================================================

[icon]

# ------------------------------------------------------------
# DIRECTORIES
# ------------------------------------------------------------

prepend_dirs = [
    {
        name = "*",
        text = "",
        fg = "#88C0D0",
    },
]


# ------------------------------------------------------------
# C / C++
# ------------------------------------------------------------

prepend_exts = [

    { name = "c",   text = "", fg = "#81A1C1" },
    { name = "h",   text = "", fg = "#81A1C1" },
    { name = "cpp", text = "", fg = "#81A1C1" },
    { name = "cc",  text = "", fg = "#81A1C1" },
    { name = "hpp", text = "", fg = "#81A1C1" },

    # --------------------------------------------------------
    # Java
    # --------------------------------------------------------

    { name = "java", text = "", fg = "#D08770" },

    # --------------------------------------------------------
    # Python
    # --------------------------------------------------------

    { name = "py", text = "", fg = "#EBCB8B" },

    # --------------------------------------------------------
    # JavaScript
    # --------------------------------------------------------

    { name = "js",  text = "", fg = "#EBCB8B" },
    { name = "mjs", text = "", fg = "#EBCB8B" },
    { name = "cjs", text = "", fg = "#EBCB8B" },

    # --------------------------------------------------------
