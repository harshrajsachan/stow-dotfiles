# ============================================================
# SPECIAL FILES
# ============================================================

prepend_files = [

    {
        name = ".gitignore",
        text = "",
        fg = "#BF616A",
    },

    {
        name = ".gitmodules",
        text = "",
        fg = "#BF616A",
    },

    {
        name = "Dockerfile",
        text = "",
        fg = "#81A1C1",
    },

    {
        name = "Makefile",
        text = "",
        fg = "#D08770",
    },
]


# ============================================================
# CONDITIONAL ICONS
# ============================================================

prepend_conds = [

    # Hidden directories
    {
        if = "hidden & dir",
        text = "",
        fg = "#4C566A",
    },

    # Hidden files
    {
        if = "hidden",
        text = "",
        fg = "#4C566A",
    },

    # Executables
    {
        if = "exec",
        text = "",
        fg = "#A3BE8C",
    },

    # Symlinks
    {
        if = "link",
        text = "",
        fg = "#8FBCBB",
    },

    # Broken symlinks
    {
        if = "orphan",
        text = "",
        fg = "#BF616A",
    },
]


# ============================================================
# WHICH
# ============================================================

