    # --------------------------------------------------------

    { name = "ts",  text = "", fg = "#81A1C1" },
    { name = "tsx", text = "", fg = "#81A1C1" },

    # --------------------------------------------------------
    # Lua
    # --------------------------------------------------------

    { name = "lua", text = "", fg = "#81A1C1" },

    # --------------------------------------------------------
    # Rust
    # --------------------------------------------------------

    { name = "rs", text = "", fg = "#D08770" },

    # --------------------------------------------------------
    # Go
    # --------------------------------------------------------

    { name = "go", text = "", fg = "#8FBCBB" },

    # --------------------------------------------------------
    # HTML
    # --------------------------------------------------------

    { name = "html", text = "", fg = "#BF616A" },

    # --------------------------------------------------------
    # CSS
    # --------------------------------------------------------

    { name = "css", text = "", fg = "#81A1C1" },

    # --------------------------------------------------------
    # JSON
    # --------------------------------------------------------

    { name = "json", text = "", fg = "#EBCB8B" },

    # --------------------------------------------------------
    # YAML
    # --------------------------------------------------------

    { name = "yaml", fg = "#BF616A", text = "" },
    { name = "yml",  fg = "#BF616A", text = "" },

    # --------------------------------------------------------
    # Markdown
    # --------------------------------------------------------

    { name = "md", fg = "#B48EAD", text = "" },

    # --------------------------------------------------------
