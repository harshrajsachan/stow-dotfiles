# ============================================================
# BERSERK — YAZI
# Monochrome / Black / White / Gray
# ============================================================
#
# PALETTE
#
# BLACK       #050505  background
# BLACK_0     #0A0A0A  darkest surface
# BLACK_1     #111111  surface
# BLACK_2     #1A1A1A  raised surface
#
# WHITE       #F2F2F2  primary text
# WHITE_DIM   #D0D0D0  secondary text
# GRAY        #8A8A8A  muted text
# GRAY_DIM    #666666  hidden / very muted
# GRAY_DARK   #3A3A3A  borders
#
# SELECT      #D8D8D8  current item highlight
# SELECT_DIM  #B8B8B8  preview highlight
#
# ============================================================


# ============================================================
# APPLICATION
# ============================================================

[app]

overall = {
    fg = "#F2F2F2",
}


# ============================================================
# MANAGER
# ============================================================

[mgr]

cwd = {
    fg = "#F2F2F2",
    bold = true,
}

find_keyword = {
    fg = "#F2F2F2",
    bg = "#3A3A3A",
    bold = true,
}

find_position = {
    fg = "#8A8A8A",
    italic = true,
}

symlink_target = {
    fg = "#8A8A8A",
}

marker_copied = {
    fg = "#050505",
    bg = "#B8B8B8",
}

marker_cut = {
    fg = "#050505",
    bg = "#8A8A8A",
}

marker_marked = {
    fg = "#050505",
    bg = "#D0D0D0",
}

marker_selected = {
    fg = "#050505",
    bg = "#D8D8D8",
}

count_copied = {
    fg = "#050505",
    bg = "#B8B8B8",
}

count_cut = {
    fg = "#050505",
    bg = "#8A8A8A",
}

count_selected = {
    fg = "#050505",
    bg = "#D8D8D8",
}

border_symbol = "│"

border_style = {
    fg = "#3A3A3A",
}


# ============================================================
# INDICATOR
#
# This is the important part for the visual you wanted.
#
# current = active row
# parent  = active row in parent pane
# preview = active row in preview pane
#
# Padding creates the visible highlighted indicator block.
# ============================================================

[indicator]

parent = {
    fg = "#050505",
    bg = "#B8B8B8",
    bold = true,
}

current = {
    fg = "#050505",
    bg = "#D8D8D8",
    bold = true,
}

preview = {
    fg = "#050505",
    bg = "#B8B8B8",
    bold = true,
}

padding = {
    open = "▐",
    close = "▌",
}


# ============================================================
# TABS
# ============================================================

[tabs]

active = {
    fg = "#050505",
    bg = "#D8D8D8",
    bold = true,
}

inactive = {
    fg = "#666666",
}

sep_inner = {
    open = "",
    close = "",
}

sep_outer = {
    open = "",
    close = "",
}


# ============================================================
# MODE
# ============================================================

[mode]

normal_main = {
    fg = "#050505",
    bg = "#D8D8D8",
    bold = true,
}

normal_alt = {
    fg = "#F2F2F2",
    bold = true,
}

select_main = {
    fg = "#050505",
    bg = "#B8B8B8",
    bold = true,
}

select_alt = {
    fg = "#D0D0D0",
    bold = true,
}

unset_main = {
    fg = "#050505",
    bg = "#8A8A8A",
    bold = true,
}

unset_alt = {
    fg = "#8A8A8A",
    bold = true,
}


# ============================================================
# STATUS
# ============================================================

[status]

overall = {
    fg = "#D0D0D0",
}

sep_left = {
    open = "",
    close = "",
}

sep_right = {
    open = "",
    close = "",
}

perm_type = {
    fg = "#F2F2F2",
}

perm_read = {
    fg = "#D0D0D0",
}

perm_write = {
    fg = "#8A8A8A",
}

perm_exec = {
    fg = "#F2F2F2",
}

perm_sep = {
    fg = "#3A3A3A",
}

progress_label = {
    fg = "#D0D0D0",
}

progress_normal = {
    fg = "#D0D0D0",
}

progress_error = {
    fg = "#666666",
}


# ============================================================
# FILE TYPES
# ============================================================

[filetype]

rules = [

    # --------------------------------------------------------
    # DIRECTORIES
    # --------------------------------------------------------

    {
        url = "*/",
        fg = "#F2F2F2",
        bold = true,
    },

    # --------------------------------------------------------
    # IMAGES
    # --------------------------------------------------------

    {
        mime = "image/*",
        fg = "#D0D0D0",
    },

    # --------------------------------------------------------
    # VIDEO
    # --------------------------------------------------------

    {
        mime = "video/*",
        fg = "#B8B8B8",
    },

    # --------------------------------------------------------
    # AUDIO
    # --------------------------------------------------------

    {
        mime = "audio/*",
        fg = "#D0D0D0",
    },

    # --------------------------------------------------------
    # ARCHIVES
    # --------------------------------------------------------

    {
        mime = "application/zip",
        fg = "#8A8A8A",
    },

    {
        mime = "application/x-tar",
        fg = "#8A8A8A",
    },

    {
        mime = "application/x-7z-compressed",
        fg = "#8A8A8A",
    },

    {
        mime = "application/x-rar",
        fg = "#8A8A8A",
    },

    # --------------------------------------------------------
    # EXECUTABLES
    # --------------------------------------------------------

    {
        url = "*",
        is = "exec",
        fg = "#F2F2F2",
        bold = true,
    },

    # --------------------------------------------------------
    # SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "link",
        fg = "#B8B8B8",
    },

    # --------------------------------------------------------
    # BROKEN SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "orphan",
        fg = "#666666",
        crossed = true,
    },

    # --------------------------------------------------------
    # EMPTY FILES
    # --------------------------------------------------------

    {
        mime = "inode/empty",
        fg = "#666666",
    },

    # --------------------------------------------------------
    # NORMAL FILES
    # --------------------------------------------------------

    {
        url = "*",
        fg = "#D0D0D0",
    },
]


# ============================================================
# ICONS
#
# All icons remain monochrome.
#
# White      = important / directories
# Light gray = normal programming files
# Gray       = documents / archives / hidden
# ============================================================

[icon]

# ------------------------------------------------------------
# DIRECTORIES
# ------------------------------------------------------------

prepend_dirs = [
    {
        name = "*",
        text = "",
        fg = "#F2F2F2",
    },
]


# ------------------------------------------------------------
# C / C++
# ------------------------------------------------------------

prepend_exts = [

    { name = "c",   text = "", fg = "#D0D0D0" },
    { name = "h",   text = "", fg = "#D0D0D0" },
    { name = "cpp", text = "", fg = "#D0D0D0" },
    { name = "cc",  text = "", fg = "#D0D0D0" },
    { name = "hpp", text = "", fg = "#D0D0D0" },

    # --------------------------------------------------------
    # Java
    # --------------------------------------------------------

    { name = "java", fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # Python
    # --------------------------------------------------------

    { name = "py", fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # JavaScript
    # --------------------------------------------------------

    { name = "js",  fg = "#D0D0D0", text = "" },
    { name = "mjs", fg = "#D0D0D0", text = "" },
    { name = "cjs", fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # TypeScript
    # --------------------------------------------------------

    { name = "ts",  fg = "#D0D0D0", text = "" },
    { name = "tsx", fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # Lua
    # --------------------------------------------------------

    { name = "lua", fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # Rust
    # --------------------------------------------------------

    { name = "rs", fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # Go
    # --------------------------------------------------------

    { name = "go", fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # HTML
    # --------------------------------------------------------

    { name = "html", fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # CSS
    # --------------------------------------------------------

    { name = "css", fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # JSON
    # --------------------------------------------------------

    { name = "json", fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # YAML
    # --------------------------------------------------------

    { name = "yaml", fg = "#D0D0D0", text = "" },
    { name = "yml",  fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # Markdown
    # --------------------------------------------------------

    { name = "md", fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # Shell
    # --------------------------------------------------------

    { name = "sh",   fg = "#D0D0D0", text = "" },
    { name = "bash", fg = "#D0D0D0", text = "" },
    { name = "zsh",  fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # SQL
    # --------------------------------------------------------

    { name = "sql", fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # TOML
    # --------------------------------------------------------

    { name = "toml", fg = "#D0D0D0", text = "" },

    # --------------------------------------------------------
    # TXT
    # --------------------------------------------------------

    { name = "txt", fg = "#8A8A8A", text = "" },

    # --------------------------------------------------------
    # PDF
    # --------------------------------------------------------

    { name = "pdf", fg = "#B8B8B8", text = "" },

    # --------------------------------------------------------
    # Archives
    # --------------------------------------------------------

    { name = "zip", fg = "#8A8A8A", text = "" },
    { name = "tar", fg = "#8A8A8A", text = "" },
    { name = "gz",  fg = "#8A8A8A", text = "" },
    { name = "7z",  fg = "#8A8A8A", text = "" },
    { name = "rar", fg = "#8A8A8A", text = "" },
]


# ============================================================
# SPECIAL FILES
# ============================================================

prepend_files = [

    {
        name = ".gitignore",
        text = "",
        fg = "#D0D0D0",
    },

    {
        name = ".gitmodules",
        text = "",
        fg = "#D0D0D0",
    },

    {
        name = "Dockerfile",
        text = "",
        fg = "#D0D0D0",
    },

    {
        name = "Makefile",
        text = "",
        fg = "#D0D0D0",
    },
]


# ============================================================
# CONDITIONAL ICONS
# ============================================================

prepend_conds = [

    # Hidden directories
    {
        if = "hidden & dir",
        text = "",
        fg = "#666666",
    },

    # Hidden files
    {
        if = "hidden",
        text = "",
        fg = "#666666",
    },

    # Executables
    {
        if = "exec",
        text = "",
        fg = "#F2F2F2",
    },

    # Symlinks
    {
        if = "link",
        text = "",
        fg = "#8A8A8A",
    },

    # Broken symlinks
    {
        if = "orphan",
        text = "",
        fg = "#666666",
    },
]


# ============================================================
# WHICH
# ============================================================

[which]

cols = 2

mask = {
    fg = "#050505",
    bg = "#D8D8D8",
}

cand = {
    fg = "#F2F2F2",
    bold = true,
}

rest = {
    fg = "#8A8A8A",
}

desc = {
    fg = "#D0D0D0",
}

separator = " → "

separator_style = {
    fg = "#3A3A3A",
}


# ============================================================
# CONFIRM
# ============================================================

[confirm]

border = {
    fg = "#8A8A8A",
}

title = {
    fg = "#F2F2F2",
    bold = true,
}

body = {
    fg = "#D0D0D0",
}

list = {
    fg = "#D0D0D0",
}

btn_yes = {
    fg = "#050505",
    bg = "#D8D8D8",
    bold = true,
}

btn_no = {
    fg = "#050505",
    bg = "#8A8A8A",
    bold = true,
}

btn_labels = [
    "Yes",
    "No",
]


# ============================================================
# SPOT
# ============================================================

[spot]

border = {
    fg = "#8A8A8A",
}

title = {
    fg = "#F2F2F2",
    bold = true,
}

tbl_col = {
    fg = "#D0D0D0",
    bold = true,
}

tbl_cell = {
    fg = "#D0D0D0",
}


# ============================================================
# PICK
# ============================================================

[pick]

