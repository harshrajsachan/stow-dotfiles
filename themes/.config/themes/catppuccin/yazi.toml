# ============================================================
# SPECIAL FILES
# ============================================================

prepend_files = [

    {
        name = ".gitignore",
        text = "",
        fg = "#F38BA8",
    },

    {
        name = ".gitmodules",
        text = "",
        fg = "#F38BA8",
    },

    {
        name = "Dockerfile",
        text = "",
        fg = "#74C7EC",
    },

    {
        name = "Makefile",
        text = "",
        fg = "#FAB387",
    },
]


# ============================================================
# CONDITIONAL ICONS
# ============================================================

prepend_conds = [

    # Hidden directories
    {
        if = "hidden & dir",
        text = "",
        fg = "#6C7086",
    },

    # Hidden files
    {
        if = "hidden",
        text = "",
        fg = "#6C7086",
    },

    # Executables
    {
        if = "exec",
        text = "",
        fg = "#A6E3A1",
    },

    # Symlinks
    {
        if = "link",
        text = "",
        fg = "#94E2D5",
    },

    # Broken links
    {
        if = "orphan",
        text = "",
        fg = "#F38BA8",
    },
]


# ============================================================
# WHICH
# ============================================================

[which]

