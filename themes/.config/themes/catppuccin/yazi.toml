# ============================================================
# APPLICATION
# ============================================================

[app]

overall = {
    fg = "#CDD6F4",
}


# ============================================================
# MANAGER
# ============================================================

[mgr]

cwd = {
    fg = "#89B4FA",
    bold = true,
}

find_keyword = {
    fg = "#F9E2AF",
    bold = true,
}

find_position = {
    fg = "#CBA6F7",
    italic = true,
}

symlink_target = {
    fg = "#94E2D5",
}

marker_copied = {
    fg = "#1E1E2E",
    bg = "#A6E3A1",
}

marker_cut = {
    fg = "#1E1E2E",
    bg = "#F38BA8",
}

marker_marked = {
    fg = "#1E1E2E",
    bg = "#F9E2AF",
}

marker_selected = {
    fg = "#1E1E2E",
    bg = "#89B4FA",
}

count_copied = {
    fg = "#1E1E2E",
    bg = "#A6E3A1",
}

count_cut = {
    fg = "#1E1E2E",
    bg = "#F38BA8",
}

count_selected = {
    fg = "#1E1E2E",
    bg = "#89B4FA",
}

border_symbol = "│"

border_style = {
    fg = "#45475A",
}


# ============================================================
# INDICATOR
#
# The visible active-row highlight / indicator.
# This follows the cursor while scrolling.
# ============================================================

[indicator]

# Parent pane
parent = {
    fg = "#1E1E2E",
    bg = "#7F849C",
    bold = true,
}

# Main pane
current = {
    fg = "#1E1E2E",
    bg = "#89B4FA",
    bold = true,
}

# Preview pane
preview = {
    fg = "#1E1E2E",
    bg = "#74C7EC",
    bold = true,
}

padding = {
    open = "▐",
    close = "▌",
}


# ============================================================
# TABS
# ============================================================

[tabs]

active = {
    fg = "#1E1E2E",
    bg = "#89B4FA",
    bold = true,
}

inactive = {
    fg = "#6C7086",
}

sep_inner = {
    open = "",
    close = "",
}

sep_outer = {
    open = "",
    close = "",
}


# ============================================================
# MODE
# ============================================================

[mode]

normal_main = {
    fg = "#1E1E2E",
    bg = "#89B4FA",
    bold = true,
}

normal_alt = {
    fg = "#89B4FA",
    bold = true,
}

select_main = {
    fg = "#1E1E2E",
    bg = "#A6E3A1",
    bold = true,
}

select_alt = {
    fg = "#A6E3A1",
    bold = true,
}

unset_main = {
    fg = "#1E1E2E",
    bg = "#F38BA8",
    bold = true,
}

unset_alt = {
    fg = "#F38BA8",
    bold = true,
}


# ============================================================
# STATUS
# ============================================================

[status]

overall = {
    fg = "#CDD6F4",
}

sep_left = {
    open = "",
    close = "",
}

sep_right = {
    open = "",
    close = "",
}

perm_type = {
    fg = "#89DCEB",
}

perm_read = {
    fg = "#A6E3A1",
}

perm_write = {
    fg = "#F38BA8",
}

perm_exec = {
    fg = "#FAB387",
}

perm_sep = {
    fg = "#585B70",
}

progress_label = {
    fg = "#BAC2DE",
}

progress_normal = {
    fg = "#89B4FA",
}

progress_error = {
    fg = "#F38BA8",
}


# ============================================================
# FILE TYPES
# ============================================================

[filetype]

rules = [

    # --------------------------------------------------------
    # DIRECTORIES
    # --------------------------------------------------------

    {
        url = "*/",
        fg = "#89B4FA",
        bold = true,
    },

    # --------------------------------------------------------
    # IMAGES
    # --------------------------------------------------------

    {
        mime = "image/*",
        fg = "#F5C2E7",
    },

    # --------------------------------------------------------
    # VIDEO
    # --------------------------------------------------------

    {
        mime = "video/*",
        fg = "#F38BA8",
    },

    # --------------------------------------------------------
    # AUDIO
    # --------------------------------------------------------

    {
        mime = "audio/*",
        fg = "#CBA6F7",
    },

    # --------------------------------------------------------
    # ARCHIVES
    # --------------------------------------------------------

    {
        mime = "application/zip",
        fg = "#FAB387",
    },

    {
        mime = "application/x-tar",
        fg = "#FAB387",
    },

    {
        mime = "application/x-7z-compressed",
        fg = "#FAB387",
    },

    {
        mime = "application/x-rar",
        fg = "#FAB387",
    },

    # --------------------------------------------------------
    # EXECUTABLES
    # --------------------------------------------------------

    {
        url = "*",
        is = "exec",
        fg = "#A6E3A1",
        bold = true,
    },

    # --------------------------------------------------------
    # SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "link",
        fg = "#94E2D5",
    },

    # --------------------------------------------------------
    # BROKEN SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "orphan",
        fg = "#F38BA8",
        crossed = true,
    },

    # --------------------------------------------------------
    # EMPTY FILES
    # --------------------------------------------------------

    {
        mime = "inode/empty",
        fg = "#6C7086",
    },

    # --------------------------------------------------------
    # NORMAL FILES
    # --------------------------------------------------------

    {
        url = "*",
        fg = "#CDD6F4",
    },
]


# ============================================================
# ICONS
# ============================================================

[icon]

# ------------------------------------------------------------
# DIRECTORIES
# ------------------------------------------------------------

prepend_dirs = [
    {
        name = "*",
        text = "",
        fg = "#89B4FA",
    },
]


