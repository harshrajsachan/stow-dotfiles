# ============================================================
# CATPPUCCIN MOCHA — YAZI
# Dark / blue / mauve / pastel
# ============================================================


# ============================================================
# PALETTE
# ============================================================

# Background
# bg         #1E1E2E
# bg0        #11111B
# bg1        #181825
# bg2        #45475A
# bg3        #585B70

# Foreground
# fg         #CDD6F4
# fg1        #BAC2DE
# fg2        #A6ADC8
# gray       #6C7086

# Catppuccin
# red        #F38BA8
# green      #A6E3A1
# yellow     #F9E2AF
# blue       #89B4FA
# purple     #F5C2E7
# aqua       #94E2D5
# orange     #FAB387

# Selection
# select     #CBA6F7
# select_dim #585B70


# ============================================================
# APPLICATION
# ============================================================

[app]

overall = {
    fg = "#CDD6F4",
}


# ============================================================
# MANAGER
# ============================================================

[mgr]

cwd = {
    fg = "#F9E2AF",
    bold = true,
}

find_keyword = {
    fg = "#F9E2AF",
    bold = true,
}

find_position = {
    fg = "#F5C2E7",
    italic = true,
}

symlink_target = {
    fg = "#94E2D5",
}

marker_copied = {
    fg = "#1E1E2E",
    bg = "#A6E3A1",
}

marker_cut = {
    fg = "#1E1E2E",
    bg = "#F38BA8",
}

marker_marked = {
    fg = "#1E1E2E",
    bg = "#F9E2AF",
}

marker_selected = {
    fg = "#1E1E2E",
    bg = "#CBA6F7",
}

count_copied = {
    fg = "#1E1E2E",
    bg = "#A6E3A1",
}

count_cut = {
    fg = "#1E1E2E",
    bg = "#F38BA8",
}

count_selected = {
    fg = "#1E1E2E",
    bg = "#CBA6F7",
}

border_symbol = "│"

border_style = {
    fg = "#45475A",
}


# ============================================================
# INDICATOR
# ============================================================

[indicator]

# Parent pane
parent = {
    fg = "#1E1E2E",
    bg = "#89B4FA",
    bold = true,
}

# Current pane
current = {
    fg = "#1E1E2E",
    bg = "#F9E2AF",
    bold = true,
}

# Preview pane
preview = {
    fg = "#1E1E2E",
    bg = "#94E2D5",
    bold = true,
}

padding = {
    open = "▐",
    close = "▌",
}


# ============================================================
# TABS
# ============================================================

[tabs]

active = {
    fg = "#1E1E2E",
    bg = "#F9E2AF",
    bold = true,
}

inactive = {
    fg = "#6C7086",
}

sep_inner = {
    open = "",
    close = "",
}

sep_outer = {
    open = "",
    close = "",
}


# ============================================================
# MODE
# ============================================================

[mode]

normal_main = {
    fg = "#1E1E2E",
    bg = "#F9E2AF",
    bold = true,
}

normal_alt = {
    fg = "#F9E2AF",
    bold = true,
}

select_main = {
    fg = "#1E1E2E",
    bg = "#A6E3A1",
    bold = true,
}

select_alt = {
    fg = "#A6E3A1",
    bold = true,
}

unset_main = {
    fg = "#1E1E2E",
    bg = "#F38BA8",
    bold = true,
}

unset_alt = {
    fg = "#F38BA8",
    bold = true,
}


# ============================================================
# STATUS
# ============================================================

[status]

overall = {
    fg = "#BAC2DE",
}

sep_left = {
    open = "",
    close = "",
}

sep_right = {
    open = "",
    close = "",
}

perm_type = {
    fg = "#89B4FA",
}

perm_read = {
    fg = "#A6E3A1",
}

perm_write = {
    fg = "#F38BA8",
}

perm_exec = {
    fg = "#FAB387",
}

perm_sep = {
    fg = "#585B70",
}

progress_label = {
    fg = "#BAC2DE",
}

progress_normal = {
    fg = "#F9E2AF",
}

progress_error = {
    fg = "#F38BA8",
}


# ============================================================
# FILE TYPES
# ============================================================

[filetype]

rules = [

    # --------------------------------------------------------
    # DIRECTORIES
    # --------------------------------------------------------

    {
        url = "*/",
        fg = "#F9E2AF",
        bold = true,
    },

    # --------------------------------------------------------
    # IMAGES
    # --------------------------------------------------------

    {
        mime = "image/*",
        fg = "#F5C2E7",
    },

    # --------------------------------------------------------
    # VIDEO
    # --------------------------------------------------------

    {
        mime = "video/*",
        fg = "#F38BA8",
    },

    # --------------------------------------------------------
    # AUDIO
    # --------------------------------------------------------

    {
        mime = "audio/*",
        fg = "#94E2D5",
    },

    # --------------------------------------------------------
    # ARCHIVES
    # --------------------------------------------------------

    {
        mime = "application/zip",
        fg = "#FAB387",
    },

    {
        mime = "application/x-tar",
        fg = "#FAB387",
    },

    {
        mime = "application/x-7z-compressed",
        fg = "#FAB387",
    },

    {
        mime = "application/x-rar",
        fg = "#FAB387",
    },

    # --------------------------------------------------------
    # EXECUTABLES
    # --------------------------------------------------------

    {
        url = "*",
        is = "exec",
        fg = "#A6E3A1",
        bold = true,
    },

    # --------------------------------------------------------
    # SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "link",
        fg = "#94E2D5",
    },

    # --------------------------------------------------------
    # BROKEN SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "orphan",
        fg = "#F38BA8",
        crossed = true,
    },

    # --------------------------------------------------------
    # EMPTY
    # --------------------------------------------------------

    {
        mime = "inode/empty",
        fg = "#6C7086",
    },

    # --------------------------------------------------------
    # NORMAL FILES
    # --------------------------------------------------------

    {
        url = "*",
        fg = "#CDD6F4",
    },
]


