# ============================================================
# TWILIGHT — YAZI
# Dark cinematic / lavender / blue / mauve
# ============================================================
#
# PALETTE
#
# Background
#   #15161C
#
# Surface
#   #1D1F27
#   #252834
#   #303440
#
# Foreground
#   #D7D9E0
#   #A8ABB5
#   #747784
#   #50535E
#
# Cool
#   #B4A7D6  Lavender
#   #899CCB  Blue
#   #8DB4C7  Sky
#   #86B8AD  Teal
#   #C39BBE  Mauve
#   #9B8DB8  Purple
#
# Warm
#   #D5B47A  Amber
#   #C48C9A  Rose
#   #C97C86  Red
#   #9BB88B  Green
#
# Selection
#   #AFA5C8
#   #77758A
#
# ============================================================


# ============================================================
# APPLICATION
# ============================================================

[app]

overall = {
    fg = "#D7D9E0",
}


# ============================================================
# MANAGER
# ============================================================

[mgr]

cwd = {
    fg = "#B4A7D6",
    bold = true,
}

find_keyword = {
    fg = "#D5B47A",
    bold = true,
}

find_position = {
    fg = "#C39BBE",
    italic = true,
}

symlink_target = {
    fg = "#8DB4C7",
}

marker_copied = {
    fg = "#15161C",
    bg = "#9BB88B",
}

marker_cut = {
    fg = "#15161C",
    bg = "#C97C86",
}

marker_marked = {
    fg = "#15161C",
    bg = "#D5B47A",
}

marker_selected = {
    fg = "#15161C",
    bg = "#AFA5C8",
}

count_copied = {
    fg = "#15161C",
    bg = "#9BB88B",
}

count_cut = {
    fg = "#15161C",
    bg = "#C97C86",
}

count_selected = {
    fg = "#15161C",
    bg = "#AFA5C8",
}

border_symbol = "│"

border_style = {
    fg = "#303440",
}


# ============================================================
# INDICATOR
#
# Strong moving active-row highlight.
# ============================================================

[indicator]

# Parent pane
parent = {
    fg = "#15161C",
    bg = "#899CCB",
    bold = true,
}

# Current pane
current = {
    fg = "#15161C",
    bg = "#AFA5C8",
    bold = true,
}

# Preview pane
preview = {
    fg = "#15161C",
    bg = "#86B8AD",
    bold = true,
}

padding = {
    open = "▐",
    close = "▌",
}


# ============================================================
# TABS
# ============================================================

[tabs]

active = {
    fg = "#15161C",
    bg = "#AFA5C8",
    bold = true,
}

inactive = {
    fg = "#747784",
}

sep_inner = {
    open = "",
    close = "",
}

sep_outer = {
    open = "",
    close = "",
}


# ============================================================
# MODE
# ============================================================

[mode]

normal_main = {
    fg = "#15161C",
    bg = "#AFA5C8",
    bold = true,
}

normal_alt = {
    fg = "#AFA5C8",
    bold = true,
}

select_main = {
    fg = "#15161C",
    bg = "#9BB88B",
    bold = true,
}

select_alt = {
    fg = "#9BB88B",
    bold = true,
}

unset_main = {
    fg = "#15161C",
    bg = "#C97C86",
    bold = true,
}

unset_alt = {
    fg = "#C97C86",
    bold = true,
}


# ============================================================
# STATUS
# ============================================================

[status]

overall = {
    fg = "#A8ABB5",
}

sep_left = {
    open = "",
    close = "",
}

sep_right = {
    open = "",
    close = "",
}

perm_type = {
    fg = "#8DB4C7",
}

perm_read = {
    fg = "#9BB88B",
}

perm_write = {
    fg = "#C48C9A",
}

perm_exec = {
    fg = "#D5B47A",
}

perm_sep = {
    fg = "#50535E",
}

progress_label = {
    fg = "#A8ABB5",
}

progress_normal = {
    fg = "#899CCB",
}

progress_error = {
    fg = "#C97C86",
}


# ============================================================
# FILE TYPES
# ============================================================

[filetype]

rules = [

    # --------------------------------------------------------
    # DIRECTORIES
    # --------------------------------------------------------

    {
        url = "*/",
        fg = "#B4A7D6",
        bold = true,
    },

    # --------------------------------------------------------
    # IMAGES
    # --------------------------------------------------------

    {
        mime = "image/*",
        fg = "#C39BBE",
    },

    # --------------------------------------------------------
    # VIDEO
    # --------------------------------------------------------

    {
        mime = "video/*",
        fg = "#C48C9A",
    },

    # --------------------------------------------------------
    # AUDIO
    # --------------------------------------------------------

    {
        mime = "audio/*",
        fg = "#86B8AD",
    },

    # --------------------------------------------------------
    # ARCHIVES
    # --------------------------------------------------------

    {
        mime = "application/zip",
        fg = "#D5B47A",
    },

    {
        mime = "application/x-tar",
        fg = "#D5B47A",
    },

    {
        mime = "application/x-7z-compressed",
        fg = "#D5B47A",
    },

    {
        mime = "application/x-rar",
        fg = "#D5B47A",
    },

    # --------------------------------------------------------
    # EXECUTABLES
    # --------------------------------------------------------

    {
        url = "*",
        is = "exec",
        fg = "#D5B47A",
        bold = true,
    },

    # --------------------------------------------------------
    # SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "link",
        fg = "#8DB4C7",
    },

    # --------------------------------------------------------
    # BROKEN SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "orphan",
        fg = "#C97C86",
        crossed = true,
    },

    # --------------------------------------------------------
    # EMPTY FILES
    # --------------------------------------------------------

    {
        mime = "inode/empty",
        fg = "#747784",
    },

    # --------------------------------------------------------
    # NORMAL FILES
    # --------------------------------------------------------

    {
        url = "*",
        fg = "#D7D9E0",
    },
]


