        fg = "#D5B47A",
    },
]


# ============================================================
# CONDITIONAL ICONS
# ============================================================

prepend_conds = [

    # Hidden directories
    {
        if = "hidden & dir",
        text = "",
        fg = "#50535E",
    },

    # Hidden files
    {
        if = "hidden",
        text = "",
        fg = "#50535E",
    },

    # Executables
    {
        if = "exec",
        text = "",
        fg = "#D5B47A",
    },

    # Symlinks
    {
        if = "link",
        text = "",
        fg = "#8DB4C7",
    },

    # Broken symlinks
    {
        if = "orphan",
        text = "",
        fg = "#C97C86",
    },
]


