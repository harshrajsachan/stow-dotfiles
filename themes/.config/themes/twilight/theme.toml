    },

    {
        name = "Makefile",
        text = "",
        fg = "#D5B47A",
    },
]


# ============================================================
# CONDITIONAL ICONS
# ============================================================

prepend_conds = [

    # --------------------------------------------------------
    # BROKEN SYMLINKS
    # --------------------------------------------------------

    {
        if = "orphan",
        text = "",
        fg = "#C97C86",
    },


    # --------------------------------------------------------
    # SYMLINKS
    # --------------------------------------------------------

    {
        if = "link",
        text = "",
        fg = "#86B8AD",
    },


    # --------------------------------------------------------
    # HIDDEN DIRECTORIES
    # --------------------------------------------------------

    {
        if = "hidden & dir",
        text = "",
        fg = "#50535E",
    },


    # --------------------------------------------------------
    # DIRECTORIES
    #
    # IMPORTANT:
    # Explicitly match directories so they never receive
    # the executable/terminal icon.
    # --------------------------------------------------------

    {
        if = "dir",
        text = "",
        fg = "#D5B47A",
    },


    # --------------------------------------------------------
    # HIDDEN FILES
    # --------------------------------------------------------

    {
        if = "hidden & !dir",
        text = "",
        fg = "#50535E",
    },


    # --------------------------------------------------------
    # EXECUTABLE FILES
    #
    # IMPORTANT:
    # !dir prevents directories from being treated as
    # executable files simply because they have the execute
    # permission.
    # --------------------------------------------------------

    {
        if = "exec",
        text = "",
        fg = "#9BB88B",
    },
]


