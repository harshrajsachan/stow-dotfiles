# ============================================================
# TWILIGHT — YAZI
# Dark cinematic / lavender / blue / mauve
# ============================================================


# ============================================================
# PALETTE
# ============================================================

# Background
# bg         #15161C
# bg0        #1D1F27
# bg1        #252834
# bg2        #303440
# bg3        #77758A

# Foreground
# fg         #D7D9E0
# fg1        #A8ABB5
# fg2        #747784
# gray       #50535E

# Twilight
# red        #C97C86
# green      #9BB88B
# yellow     #D5B47A
# blue       #899CCB
# purple     #C39BBE
