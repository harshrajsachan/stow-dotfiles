    fg = "#7FBBB3",
    bold = true,
}

tbl_cell = {
    fg = "#D3C6AA",
}


# ============================================================
# PICK
# ============================================================

[pick]

border = {
    fg = "#475258",
}

active = {
    fg = "#2D353B",
    bg = "#A7C080",
    bold = true,
}

inactive = {
    fg = "#D3C6AA",
}


# ============================================================
# INPUT
# ============================================================

[input]

