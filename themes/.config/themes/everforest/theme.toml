    fg = "#D3C6AA",
}

list = {
    fg = "#D3C6AA",
}

btn_yes = {
    fg = "#2D353B",
    bg = "#A7C080",
    bold = true,
}

btn_no = {
    fg = "#2D353B",
    bg = "#E67E80",
    bold = true,
}

