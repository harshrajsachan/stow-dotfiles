# ============================================================
# EVERFOREST DARK — YAZI
# ============================================================

# ============================================================
# PALETTE
# ============================================================

# bg         #2D353B
# bg_dim     #343F44
# surface0   #3D484D
# surface1   #475258

# fg         #D3C6AA
# fg_dim     #A7A7A0
# muted      #859289

# red        #E67E80
# orange     #E69875
# yellow     #DBBC7F
# green      #A7C080
# aqua       #83C092
# blue       #7FBBB3
# purple     #D699B6


# ============================================================
# APPLICATION
# ============================================================

[app]

overall = {
    fg = "#D3C6AA",
}


# ============================================================
# MANAGER
# ============================================================

[mgr]

cwd = {
    fg = "#A7C080",
    bold = true,
}

find_keyword = {
    fg = "#DBBC7F",
    bold = true,
}

find_position = {
    fg = "#D699B6",
    italic = true,
}

symlink_target = {
    fg = "#83C092",
}

marker_copied = {
    fg = "#2D353B",
    bg = "#A7C080",
}

marker_cut = {
    fg = "#2D353B",
    bg = "#E67E80",
}

marker_marked = {
    fg = "#2D353B",
    bg = "#DBBC7F",
}

marker_selected = {
    fg = "#2D353B",
    bg = "#A7C080",
}

count_copied = {
    fg = "#2D353B",
    bg = "#A7C080",
}

count_cut = {
    fg = "#2D353B",
    bg = "#E67E80",
}

count_selected = {
    fg = "#2D353B",
    bg = "#A7C080",
}

border_symbol = "│"

border_style = {
    fg = "#475258",
}


# ============================================================
# INDICATOR
#
# Moving active-row highlight.
# This follows the cursor while scrolling.
# ============================================================

[indicator]

parent = {
    fg = "#2D353B",
    bg = "#7FBBB3",
    bold = true,
}

current = {
    fg = "#2D353B",
    bg = "#A7C080",
    bold = true,
}

preview = {
    fg = "#2D353B",
    bg = "#83C092",
    bold = true,
}

padding = {
    open = "▐",
    close = "▌",
}


# ============================================================
# TABS
# ============================================================

[tabs]

active = {
    fg = "#2D353B",
    bg = "#A7C080",
    bold = true,
}

inactive = {
    fg = "#859289",
}

sep_inner = {
    open = "",
    close = "",
}

sep_outer = {
    open = "",
    close = "",
}


# ============================================================
# MODE
# ============================================================

[mode]

normal_main = {
    fg = "#2D353B",
    bg = "#A7C080",
    bold = true,
}

normal_alt = {
    fg = "#A7C080",
    bold = true,
}

select_main = {
    fg = "#2D353B",
    bg = "#DBBC7F",
    bold = true,
}

select_alt = {
    fg = "#DBBC7F",
    bold = true,
}

unset_main = {
    fg = "#2D353B",
    bg = "#E67E80",
    bold = true,
}

unset_alt = {
    fg = "#E67E80",
    bold = true,
}


# ============================================================
# STATUS
# ============================================================

[status]

overall = {
    fg = "#D3C6AA",
}

sep_left = {
    open = "",
    close = "",
}

sep_right = {
    open = "",
    close = "",
}

perm_type = {
    fg = "#7FBBB3",
}

perm_read = {
    fg = "#A7C080",
}

perm_write = {
    fg = "#E67E80",
}

perm_exec = {
    fg = "#E69875",
}

perm_sep = {
    fg = "#475258",
}

progress_label = {
    fg = "#D3C6AA",
}

progress_normal = {
    fg = "#A7C080",
}

progress_error = {
    fg = "#E67E80",
}


# ============================================================
# FILE TYPES
# ============================================================

[filetype]

rules = [

    # --------------------------------------------------------
    # DIRECTORIES
    # --------------------------------------------------------

    {
        url = "*/",
        fg = "#A7C080",
        bold = true,
    },

    # --------------------------------------------------------
    # IMAGES
    # --------------------------------------------------------

    {
        mime = "image/*",
        fg = "#D699B6",
    },

    # --------------------------------------------------------
    # VIDEO
    # --------------------------------------------------------

    {
        mime = "video/*",
        fg = "#E67E80",
    },

    # --------------------------------------------------------
    # AUDIO
    # --------------------------------------------------------

    {
        mime = "audio/*",
        fg = "#83C092",
    },

    # --------------------------------------------------------
    # ARCHIVES
    # --------------------------------------------------------

    {
        mime = "application/zip",
        fg = "#E69875",
    },

    {
        mime = "application/x-tar",
        fg = "#E69875",
    },

    {
        mime = "application/x-7z-compressed",
        fg = "#E69875",
    },

    {
        mime = "application/x-rar",
        fg = "#E69875",
    },

    # --------------------------------------------------------
    # EXECUTABLES
    # --------------------------------------------------------

    {
        url = "*",
        is = "exec",
        fg = "#E69875",
        bold = true,
    },

    # --------------------------------------------------------
    # SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "link",
        fg = "#83C092",
    },

    # --------------------------------------------------------
    # BROKEN SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "orphan",
        fg = "#E67E80",
        crossed = true,
    },

    # --------------------------------------------------------
    # EMPTY FILES
    # --------------------------------------------------------

    {
        mime = "inode/empty",
        fg = "#859289",
    },

    # --------------------------------------------------------
    # NORMAL FILES
    # --------------------------------------------------------

    {
        url = "*",
        fg = "#D3C6AA",
    },
]


# ============================================================
# ICONS
# ============================================================

[icon]

# ------------------------------------------------------------
# DIRECTORIES
# ------------------------------------------------------------

prepend_dirs = [
    {
        name = "*",
        text = "",
        fg = "#A7C080",
    },
]


# ------------------------------------------------------------
# C / C++
# ------------------------------------------------------------

prepend_exts = [

    { name = "c",   text = "", fg = "#7FBBB3" },
    { name = "h",   text = "", fg = "#7FBBB3" },
    { name = "cpp", text = "", fg = "#7FBBB3" },
    { name = "cc",  text = "", fg = "#7FBBB3" },
    { name = "hpp", text = "", fg = "#7FBBB3" },

    # --------------------------------------------------------
    # Java
    # --------------------------------------------------------

    { name = "java", text = "", fg = "#E69875" },

    # --------------------------------------------------------
    # Python
    # --------------------------------------------------------

    { name = "py", text = "", fg = "#DBBC7F" },

    # --------------------------------------------------------
    # JavaScript
    # --------------------------------------------------------

    { name = "js",  text = "", fg = "#DBBC7F" },
    { name = "mjs", text = "", fg = "#DBBC7F" },
    { name = "cjs", text = "", fg = "#DBBC7F" },

    # --------------------------------------------------------
    # TypeScript
    # --------------------------------------------------------

    { name = "ts",  text = "", fg = "#7FBBB3" },
    { name = "tsx", text = "", fg = "#7FBBB3" },

    # --------------------------------------------------------
    # Lua
    # --------------------------------------------------------

    { name = "lua", text = "", fg = "#7FBBB3" },

    # --------------------------------------------------------
    # Rust
    # --------------------------------------------------------

    { name = "rs", text = "", fg = "#E69875" },

    # --------------------------------------------------------
    # Go
    # --------------------------------------------------------

    { name = "go", text = "", fg = "#83C092" },

    # --------------------------------------------------------
    # HTML
    # --------------------------------------------------------

    { name = "html", text = "", fg = "#E67E80" },

    # --------------------------------------------------------
    # CSS
    # --------------------------------------------------------

    { name = "css", text = "", fg = "#7FBBB3" },

    # --------------------------------------------------------
    # JSON
    # --------------------------------------------------------

    { name = "json", text = "", fg = "#DBBC7F" },

    # --------------------------------------------------------
    # YAML
    # --------------------------------------------------------

    { name = "yaml", fg = "#E67E80", text = "" },
    { name = "yml",  fg = "#E67E80", text = "" },

    # --------------------------------------------------------
    # Markdown
    # --------------------------------------------------------

    { name = "md", fg = "#D699B6", text = "" },

    # --------------------------------------------------------
    # Shell
    # --------------------------------------------------------

    { name = "sh",   fg = "#A7C080", text = "" },
    { name = "bash", fg = "#A7C080", text = "" },
    { name = "zsh",  fg = "#A7C080", text = "" },

    # --------------------------------------------------------
    # SQL
    # --------------------------------------------------------

    { name = "sql", fg = "#83C092", text = "" },

    # --------------------------------------------------------
    # TOML
    # --------------------------------------------------------

    { name = "toml", fg = "#D699B6", text = "" },

    # --------------------------------------------------------
    # Text
    # --------------------------------------------------------

    { name = "txt", fg = "#859289", text = "" },

    # --------------------------------------------------------
    # PDF
    # --------------------------------------------------------

    { name = "pdf", fg = "#E67E80", text = "" },

    # --------------------------------------------------------
    # Archives
    # --------------------------------------------------------

    { name = "zip", fg = "#E69875", text = "" },
    { name = "tar", fg = "#E69875", text = "" },
    { name = "gz",  fg = "#E69875", text = "" },
    { name = "7z",  fg = "#E69875", text = "" },
    { name = "rar", fg = "#E69875", text = "" },
]


# ============================================================
# SPECIAL FILES
# ============================================================

prepend_files = [

    {
        name = ".gitignore",
        text = "",
        fg = "#E67E80",
    },

    {
        name = ".gitmodules",
        text = "",
        fg = "#E67E80",
    },

    {
        name = "Dockerfile",
        text = "",
        fg = "#7FBBB3",
    },

    {
        name = "Makefile",
        text = "",
        fg = "#E69875",
    },
]


# ============================================================
# CONDITIONAL ICONS
# ============================================================

prepend_conds = [

    # --------------------------------------------------------
    # BROKEN SYMLINKS
    # --------------------------------------------------------

    {
        if = "orphan",
        text = "",
        fg = "#E67E80",
    },

    # --------------------------------------------------------
    # SYMLINKS
    # --------------------------------------------------------

    {
        if = "link",
        text = "",
        fg = "#83C092",
    },

    # --------------------------------------------------------
    # HIDDEN DIRECTORIES
    # --------------------------------------------------------

    {
        if = "hidden & dir",
        text = "",
        fg = "#859289",
    },

    # --------------------------------------------------------
    # DIRECTORIES
    #
    # Explicit directory rule.
    # Prevents directories from receiving the executable icon.
    # --------------------------------------------------------

    {
        if = "dir",
        text = "",
        fg = "#A7C080",
    },

    # --------------------------------------------------------
    # HIDDEN FILES
    # --------------------------------------------------------

    {
        if = "hidden & !dir",
        text = "",
        fg = "#859289",
    },

    # --------------------------------------------------------
    # EXECUTABLE FILES
    #
    # IMPORTANT:
    # !dir prevents directories from getting the terminal icon.
    # --------------------------------------------------------

    {
        if = "exec & !dir",
        text = "",
        fg = "#E69875",
    },
]


# ============================================================
# WHICH
# ============================================================

[which]

cols = 2

mask = {
    fg = "#2D353B",
    bg = "#DBBC7F",
}

cand = {
    fg = "#A7C080",
    bold = true,
}

rest = {
    fg = "#859289",
}

desc = {
    fg = "#D3C6AA",
}

separator = " → "

separator_style = {
    fg = "#475258",
}


# ============================================================
# CONFIRM
# ============================================================

[confirm]

