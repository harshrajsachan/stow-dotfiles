    {
        name = ".gitignore",
        text = "",
        fg = "#FB4934",
    },

    {
        name = ".gitmodules",
        text = "",
        fg = "#FB4934",
    },

    {
        name = "Dockerfile",
        text = "",
        fg = "#83A598",
    },

    {
        name = "Makefile",
        text = "",
        fg = "#FE8019",
    },
]


# ============================================================
# CONDITIONAL ICONS
# ============================================================

prepend_conds = [

    # Hidden directories
    {
        if = "hidden & dir",
        text = "",
        fg = "#928374",
    },

    # Hidden files
    {
        if = "hidden",
        text = "",
        fg = "#928374",
    },

    # Executables
    {
        if = "exec",
        text = "",
        fg = "#B8BB26",
    },

    # Symlinks
    {
        if = "link",
        text = "",
        fg = "#8EC07C",
    },

    # Broken symlinks
    {
        if = "orphan",
        text = "",
        fg = "#FB4934",
    },
]


