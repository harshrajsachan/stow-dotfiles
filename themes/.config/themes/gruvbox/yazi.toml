# ============================================================
# GRUVBOX DARK — YAZI
# Warm / earthy / retro
# ============================================================
#
# Background
#
# bg         #282828
# bg0        #1D2021
# bg1        #3C3836
# bg2        #504945
# bg3        #665C54
#
# Foreground
#
# fg         #EBDBB2
# fg1        #D5C4A1
# fg2        #BDAE93
# gray       #928374
#
# Gruvbox
#
# red        #FB4934
# green      #B8BB26
# yellow     #FABD2F
# blue       #83A598
# purple     #D3869B
# aqua       #8EC07C
# orange     #FE8019
#
# Selection
#
# select     #D79921
# select_dim #665C54
#
# ============================================================


# ============================================================
# APPLICATION
# ============================================================

[app]

overall = {
    fg = "#EBDBB2",
}


# ============================================================
# MANAGER
# ============================================================

[mgr]

cwd = {
    fg = "#FABD2F",
    bold = true,
}

find_keyword = {
    fg = "#FABD2F",
    bold = true,
}

find_position = {
    fg = "#D3869B",
    italic = true,
}

symlink_target = {
    fg = "#8EC07C",
}

marker_copied = {
    fg = "#282828",
    bg = "#B8BB26",
}

marker_cut = {
    fg = "#282828",
    bg = "#FB4934",
}

marker_marked = {
    fg = "#282828",
    bg = "#FABD2F",
}

marker_selected = {
    fg = "#282828",
    bg = "#D79921",
}

count_copied = {
    fg = "#282828",
    bg = "#B8BB26",
}

count_cut = {
    fg = "#282828",
    bg = "#FB4934",
}

count_selected = {
    fg = "#282828",
    bg = "#D79921",
}

border_symbol = "│"

border_style = {
    fg = "#504945",
}


# ============================================================
# INDICATOR
#
# Strong moving active-row highlight.
# ============================================================

[indicator]

# Parent pane
parent = {
    fg = "#282828",
    bg = "#83A598",
    bold = true,
}

# Current pane
current = {
    fg = "#282828",
    bg = "#FABD2F",
    bold = true,
}

# Preview pane
preview = {
    fg = "#282828",
    bg = "#8EC07C",
    bold = true,
}

padding = {
    open = "▐",
    close = "▌",
}


# ============================================================
# TABS
# ============================================================

[tabs]

active = {
    fg = "#282828",
    bg = "#FABD2F",
    bold = true,
}

inactive = {
    fg = "#928374",
}

sep_inner = {
    open = "",
    close = "",
}

sep_outer = {
    open = "",
    close = "",
}


# ============================================================
# MODE
# ============================================================

[mode]

normal_main = {
    fg = "#282828",
    bg = "#FABD2F",
    bold = true,
}

normal_alt = {
    fg = "#FABD2F",
    bold = true,
}

select_main = {
    fg = "#282828",
    bg = "#B8BB26",
    bold = true,
}

select_alt = {
    fg = "#B8BB26",
    bold = true,
}

unset_main = {
    fg = "#282828",
    bg = "#FB4934",
    bold = true,
}

unset_alt = {
    fg = "#FB4934",
    bold = true,
}


# ============================================================
# STATUS
# ============================================================

[status]

overall = {
    fg = "#D5C4A1",
}

sep_left = {
    open = "",
    close = "",
}

sep_right = {
    open = "",
    close = "",
}

perm_type = {
    fg = "#83A598",
}

perm_read = {
    fg = "#B8BB26",
}

perm_write = {
    fg = "#FB4934",
}

perm_exec = {
    fg = "#FE8019",
}

perm_sep = {
    fg = "#665C54",
}

progress_label = {
    fg = "#D5C4A1",
}

progress_normal = {
    fg = "#FABD2F",
}

progress_error = {
    fg = "#FB4934",
}


# ============================================================
# FILE TYPES
# ============================================================

[filetype]

rules = [

    # --------------------------------------------------------
    # DIRECTORIES
    # --------------------------------------------------------

    {
        url = "*/",
        fg = "#FABD2F",
        bold = true,
    },

    # --------------------------------------------------------
    # IMAGES
    # --------------------------------------------------------

    {
        mime = "image/*",
        fg = "#D3869B",
    },

    # --------------------------------------------------------
    # VIDEO
    # --------------------------------------------------------

    {
        mime = "video/*",
        fg = "#FB4934",
    },

    # --------------------------------------------------------
    # AUDIO
    # --------------------------------------------------------

    {
        mime = "audio/*",
        fg = "#8EC07C",
    },

    # --------------------------------------------------------
    # ARCHIVES
    # --------------------------------------------------------

    {
        mime = "application/zip",
        fg = "#FE8019",
    },

    {
        mime = "application/x-tar",
        fg = "#FE8019",
    },

    {
        mime = "application/x-7z-compressed",
        fg = "#FE8019",
    },

    {
        mime = "application/x-rar",
        fg = "#FE8019",
    },

    # --------------------------------------------------------
    # EXECUTABLES
    # --------------------------------------------------------

    {
        url = "*",
        is = "exec",
        fg = "#B8BB26",
        bold = true,
    },

    # --------------------------------------------------------
    # SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "link",
        fg = "#8EC07C",
    },

    # --------------------------------------------------------
    # BROKEN SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "orphan",
        fg = "#FB4934",
        crossed = true,
    },

    # --------------------------------------------------------
    # EMPTY
    # --------------------------------------------------------

    {
        mime = "inode/empty",
        fg = "#928374",
    },

    # --------------------------------------------------------
    # NORMAL FILES
    # --------------------------------------------------------

    {
        url = "*",
        fg = "#EBDBB2",
    },
]


