# =========================
# Gruvbox Theme
# =========================

# =========================
# Background / Foreground
# =========================

[colors.primary]
background = "#000000"
foreground = "#ebdbb2"

# =========================
# Normal Colors
# =========================

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

# =========================
# Bright Colors
# =========================

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

# =========================
# Cursor
# =========================

[colors.cursor]
cursor = "#ebdbb2"
