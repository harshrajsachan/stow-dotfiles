    { name = "cc",  text = "", fg = "#82B4C6" },
    { name = "hpp", text = "", fg = "#82B4C6" },

    # Java
    { name = "java", text = "", fg = "#F99C8F" },

    # Python
    { name = "py", text = "", fg = "#F99C8F" },

    # JavaScript
    { name = "js",  text = "", fg = "#F99C8F" },
    { name = "mjs", text = "", fg = "#F99C8F" },
    { name = "cjs", text = "", fg = "#F99C8F" },

    # TypeScript
    { name = "ts",  text = "", fg = "#82B4C6" },
    { name = "tsx", text = "", fg = "#82B4C6" },

    # Lua
    { name = "lua", text = "", fg = "#82B4C6" },

    # Rust
    { name = "rs", text = "", fg = "#F99C8F" },

    # Go
    { name = "go", text = "", fg = "#5FA6A0" },

    # HTML
    { name = "html", text = "", fg = "#EA4865" },

    # CSS
    { name = "css", text = "", fg = "#82B4C6" },

    # JSON
    { name = "json", text = "", fg = "#F99C8F" },

    # YAML
    { name = "yaml", text = "", fg = "#EA4865" },
    { name = "yml",  text = "", fg = "#EA4865" },

    # Markdown
    { name = "md", text = "", fg = "#C96A91" },

    # Shell
    { name = "sh",   text = "", fg = "#5FA6A0" },
    { name = "bash", text = "", fg = "#5FA6A0" },
    { name = "zsh",  text = "", fg = "#5FA6A0" },

    # SQL
    { name = "sql", text = "", fg = "#82B4C6" },

    # TOML
    { name = "toml", text = "", fg = "#C96A91" },

    # Text
    { name = "txt", text = "", fg = "#8F7C84" },

