    fg = "#82B4C6",
}

marker_copied = {
    fg = "#0D1A2E",
    bg = "#5FA6A0",
}

marker_cut = {
    fg = "#0D1A2E",
    bg = "#EA4865",
}

marker_marked = {
    fg = "#0D1A2E",
    bg = "#F99C8F",
}

marker_selected = {
    fg = "#0D1A2E",
    bg = "#F27A91",
}

