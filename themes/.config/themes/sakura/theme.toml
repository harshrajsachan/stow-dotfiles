    fg = "#EA4865",
}

progress_error = {
    fg = "#EA4865",
}


# ============================================================
# FILE TYPES
# ============================================================

[filetype]

rules = [

    # --------------------------------------------------------
    # DIRECTORIES
    # --------------------------------------------------------

    {
        url = "*/",
        fg = "#F27A91",
        bold = true,
    },

    # --------------------------------------------------------
    # IMAGES
    # --------------------------------------------------------

    {
        mime = "image/*",
        fg = "#F99C8F",
    },

    # --------------------------------------------------------
    # VIDEO
    # --------------------------------------------------------

    {
        mime = "video/*",
        fg = "#EA4865",
    },

    # --------------------------------------------------------
    # AUDIO
    # --------------------------------------------------------

    {
        mime = "audio/*",
        fg = "#C96A91",
    },

    # --------------------------------------------------------
    # ARCHIVES
    # --------------------------------------------------------

    {
        mime = "application/zip",
        fg = "#F99C8F",
    },

    {
        mime = "application/x-tar",
        fg = "#F99C8F",
    },

    {
        mime = "application/x-7z-compressed",
        fg = "#F99C8F",
    },

    {
        mime = "application/x-rar",
        fg = "#F99C8F",
    },

    # --------------------------------------------------------
    # EXECUTABLE FILES
    # --------------------------------------------------------

    {
        url = "*",
        is = "exec",
        fg = "#F99C8F",
        bold = true,
    },

    # --------------------------------------------------------
    # SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "link",
        fg = "#82B4C6",
    },

    # --------------------------------------------------------
    # BROKEN SYMLINKS
    # --------------------------------------------------------

    {
        url = "*",
        is = "orphan",
        fg = "#EA4865",
        crossed = true,
    },

    # --------------------------------------------------------
    # EMPTY
    # --------------------------------------------------------

    {
        mime = "inode/empty",
        fg = "#8F7C84",
    },

    # --------------------------------------------------------
    # NORMAL FILES
    # --------------------------------------------------------

    {
        url = "*",
        fg = "#F4E7EA",
    },
]


# ============================================================
# ICONS
# ============================================================

[icon]


# ------------------------------------------------------------
# DIRECTORIES
# ------------------------------------------------------------

prepend_dirs = [
    {
        name = "*",
        text = "",
        fg = "#F27A91",
    },
]


