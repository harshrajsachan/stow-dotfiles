    fg = "#D8C5CA",
}

sep_left = {
    open = "",
    close = "",
}

sep_right = {
    open = "",
    close = "",
}

perm_type = {
    fg = "#82B4C6",
}

perm_read = {
    fg = "#5FA6A0",
}

perm_write = {
    fg = "#EA4865",
}

