# ============================================================
# SAKURA — YAZI
# Dark Plum / Rose / Sakura
# ============================================================


# ============================================================
# PALETTE
# ============================================================

# Background
# bg       #0D1A2E
# bg0      #111827
# bg1      #1A2235
# bg2      #252C40

# Foreground
# fg       #F4E7EA
# fg_dim   #D8C5CA
# muted    #8F7C84

# Sakura
# pink     #EA4865
# rose     #F27A91
# soft     #F99C8F
# magenta  #C96A91
# plum     #731C46

# Cool accents
# cyan     #82B4C6
# blue     #6F8FA3
# teal     #5FA6A0


# ============================================================
# APPLICATION
# ============================================================

[app]

overall = {
    fg = "#F4E7EA",
}


# ============================================================
# MANAGER
# ============================================================

[mgr]

