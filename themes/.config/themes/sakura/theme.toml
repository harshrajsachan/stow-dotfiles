# ============================================================
# SPECIAL FILES
# ============================================================

prepend_files = [

    {
        name = ".gitignore",
        text = "",
        fg = "#EA4865",
    },

    {
        name = ".gitmodules",
        text = "",
        fg = "#EA4865",
    },

    {
        name = "Dockerfile",
        text = "",
        fg = "#82B4C6",
    },

    {
        name = "Makefile",
        text = "",
        fg = "#F99C8F",
    },
]


# ============================================================
# CONDITIONAL ICONS
# ============================================================

prepend_conds = [

    # --------------------------------------------------------
    # BROKEN SYMLINKS
    # --------------------------------------------------------

    {
        if = "orphan",
        text = "",
        fg = "#EA4865",
    },

    # --------------------------------------------------------
    # SYMLINKS
    # --------------------------------------------------------

    {
        if = "link",
        text = "",
        fg = "#82B4C6",
    },

    # --------------------------------------------------------
    # HIDDEN DIRECTORIES
    # --------------------------------------------------------

    {
        if = "hidden & dir",
        text = "",
        fg = "#8F7C84",
    },

    # --------------------------------------------------------
    # DIRECTORIES
    #
    # Explicit rule prevents directories from receiving
    # the executable terminal icon.
    # --------------------------------------------------------

    {
        if = "dir",
        text = "",
        fg = "#F27A91",
    },

    # --------------------------------------------------------
    # HIDDEN FILES
    # --------------------------------------------------------

    {
        if = "hidden & !dir",
        text = "",
        fg = "#8F7C84",
    },

    # --------------------------------------------------------
    # EXECUTABLE FILES
    #
    # IMPORTANT:
    # !dir prevents directories from receiving .
    # --------------------------------------------------------

    {
        if = "exec & !dir",
        text = "",
        fg = "#F99C8F",
    },
]


