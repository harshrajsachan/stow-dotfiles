    { name = "pdf", text = "", fg = "#EA4865" },

    # Archives
    { name = "zip", text = "", fg = "#F99C8F" },
    { name = "tar", text = "", fg = "#F99C8F" },
    { name = "gz",  text = "", fg = "#F99C8F" },
    { name = "7z",  text = "", fg = "#F99C8F" },
    { name = "rar", text = "", fg = "#F99C8F" },
