# =========================
# Borders
# =========================

default_border pixel 2
default_floating_border pixel 2

# =========================
# Gaps
# =========================

gaps inner 4
gaps outer 1
smart_gaps off

# =========================
# Theme Colors — Sakura Night
# =========================

# Focused — Coral
client.focused          #EA4865 #EA4865 #0D1A2E #FDF1B2 #EA4865

# Unfocused — Gray
client.unfocused        #555555 #0D1A2E #A0A0A0 #0D1A2E #555555

# Focused inactive — Dark Gray
client.focused_inactive #3A3A3A #0D1A2E #B8B8B8 #0D1A2E #3A3A3A

# Urgent — Crimson
client.urgent           #BD4667 #BD4667 #0D1A2E #FDF1B2 #BD4667

# =========================
# Sakura Night Colors
# =========================

set $bg         #000000
set $bg-alt     #0D1A2E

set $accent     #EA4865
set $accent2    #BD4667

set $white      #FDF1B2
set $gray       #A0A0A0
set $gray-dark  #3A3A3A
